function nameCardHtml(n) {
  const status = getStatus(n.n);
  const cat = CATEGORIES[n.cat];
  const badgeHtml = status === 'mastered'
    ? '<div class="badge badge-mastered">Mastered</div>'
    : status === 'learned'
    ? '<div class="badge badge-learned">Learned</div>'
    : '<div class="badge badge-new">New</div>';
  return `<div class="name-card" onclick="openDetail(${n.n})">
    <div class="name-card-num">No. ${n.n}</div>
    <div class="name-card-arabic">${n.ar}</div>
    <div class="name-card-trans">${n.tr}</div>
    <div class="name-card-meaning">${n.en.substring(0,78)}${n.en.length>78?'...':''}</div>
    <div class="name-card-badges">
      ${badgeHtml}
      <div class="cat-tag" style="background:${cat.color}18;color:${cat.color};border:1px solid ${cat.color}30">${cat.name.split(' ')[0]}</div>
    </div>
  </div>`;
}

function renderNames(el, filter='', catFilter='') {
  let names = [...NAMES].sort((a,b)=>a.n-b.n).filter(n => {
    const q = filter.toLowerCase();
    const matchSearch = !q || n.tr.toLowerCase().includes(q) || n.en.toLowerCase().includes(q) || n.ar.includes(q);
    const matchCat = !catFilter || n.cat === catFilter;
    return matchSearch && matchCat;
  });

  let html = `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px">`;
  html += `<button class="mood-chip ${!catFilter?'active':''}" onclick="renderNames(document.getElementById('pageContent'),'','')">All</button>`;
  Object.entries(CATEGORIES).forEach(([k,c]) => {
    html += `<button class="mood-chip ${catFilter===k?'active':''}" onclick="renderNames(document.getElementById('pageContent'),'','${k}')">${c.name.split(' ')[0]}</button>`;
  });
  html += `</div>`;

  if (!names.length) {
    html += `<div class="empty">
      <div class="empty-icon"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></div>
      <div class="empty-text">No names match your search</div>
    </div>`;
  } else {
    html += `<div style="font-size:11px;color:var(--text3);margin-bottom:14px;letter-spacing:1px;text-transform:uppercase">${names.length} Names</div>`;
    html += '<div class="names-grid">';
    names.forEach(n => { html += nameCardHtml(n); });
    html += '</div>';
  }
  el.innerHTML = html;
}

function filterByCategory(cat) {
  showPage('names');
  setTimeout(() => renderNames(document.getElementById('pageContent'),'',cat), 10);
}

function handleSearch(val) {
  if (currentPage !== 'names') { showPage('names'); setTimeout(()=>renderNames(document.getElementById('pageContent'),val,''),10); return; }
  renderNames(document.getElementById('pageContent'), val, '');
}

function renderMCQ(n) {
  if (!n.mcq || !n.mcq.length) return '<div style="color:var(--text3);font-size:13px">No quiz available.</div>';
  const q = n.mcq[0];
  return `<div class="mcq-wrap" id="mcq-${n.n}">
    <div class="mcq-q">${q.q}</div>
    <div class="mcq-options">
      ${q.opts.map((o,i)=>`<button class="mcq-opt" onclick="answerMCQ(${n.n},${i},${q.ans})">${o}</button>`).join('')}
    </div>
    <div class="mcq-feedback" id="mcqFb-${n.n}"></div>
    <button class="btn btn-teal mcq-next" id="mcqNext-${n.n}" onclick="nextMCQ(${n.n})" style="display:none">Next Question</button>
  </div>`;
}

function answerMCQ(num, chosen, correct) {
  const wrap = document.getElementById('mcq-'+num);
  if (!wrap || wrap.dataset.done) return;
  wrap.dataset.done = '1';
  wrap.querySelectorAll('.mcq-opt').forEach((o,i) => {
    o.disabled = true;
    if (i === correct) o.classList.add('correct');
    else if (i === chosen && chosen !== correct) o.classList.add('wrong');
  });
  const fb = document.getElementById('mcqFb-'+num);
  const isRight = chosen === correct;
  const n = NAMES.find(x=>x.n===num);
  fb.className = 'mcq-feedback show '+(isRight?'correct':'wrong');
  fb.textContent = isRight ? 'Correct.' : `Incorrect. The answer is: "${n.mcq[0].opts[correct]}"`;
  if (n.mcq.length > 1) document.getElementById('mcqNext-'+num).style.display = 'block';
  if (isRight && !state.learned[num]) markLearned(num);
}

function nextMCQ(num) {
  const n = NAMES.find(x=>x.n===num);
  if (!n||!n.mcq||n.mcq.length<2) return;
  const q = n.mcq[1];
  const wrap = document.getElementById('mcq-'+num);
  delete wrap.dataset.done;
  wrap.innerHTML = `<div class="mcq-q">${q.q}</div>
    <div class="mcq-options">
      ${q.opts.map((o,i)=>`<button class="mcq-opt" onclick="answerMCQ2(${num},${i},${q.ans})">${o}</button>`).join('')}
    </div>
    <div class="mcq-feedback" id="mcqFb-${num}"></div>`;
}

function answerMCQ2(num, chosen, correct) {
  const wrap = document.getElementById('mcq-'+num);
  if (!wrap||wrap.dataset.done) return;
  wrap.dataset.done = '1';
  wrap.querySelectorAll('.mcq-opt').forEach((o,i)=>{
    o.disabled=true;
    if(i===correct) o.classList.add('correct');
    else if(i===chosen&&chosen!==correct) o.classList.add('wrong');
  });
  const fb = document.getElementById('mcqFb-'+num);
  const n = NAMES.find(x=>x.n===num);
  const isRight = chosen===correct;
  fb.className = 'mcq-feedback show '+(isRight?'correct':'wrong');
  fb.textContent = isRight ? 'Correct.' : `Incorrect. The answer is: "${n.mcq[1].opts[correct]}"`;
}

function renderMatch(n) {
  const matches = [
    { left: "Divine Quality", right: "In Your Heart", leftText: n.tr, rightText: n.reflection.substring(0, 80) },
    { left: "When to Call", right: "The Benefit", leftText: "Feeling " + (n.moods?n.moods[0]:"lost"), rightText: n.benefits[0]?.substring(0,70) || "Inner peace" }
  ];
  const shuffled = [...matches].map((m,i) => ({...m, origIdx: i})).sort(()=>Math.random()-0.5);
  
  return `<div class="match-guide" style="background:var(--teal-dim);border-left:3px solid var(--teal);padding:12px;border-radius:var(--radius-sm);margin-bottom:14px;font-size:12px">
    <strong style="color:var(--teal)">⚡ Quick Match</strong><br>
    Connect each quality on the <strong>left</strong> with how it applies on the <strong>right</strong>
  </div>
  <div class="match-grid">
    <div class="match-column">
      <div class="match-column-title" style="color:var(--gold);font-weight:800">This Name</div>
      ${matches.map((m,i)=>`<div class="match-item" id="mw-${n.n}-${i}" onclick="selectMatch('word',${n.n},${i})" style="border:2px solid var(--gold-border);background:var(--gold-dim)">${m.leftText}</div>`).join('')}
    </div>
    <div class="match-column">
      <div class="match-column-title" style="color:var(--teal);font-weight:800">Means This For You</div>
      ${shuffled.map((m,i)=>`<div class="match-item" id="md-${n.n}-${i}" onclick="selectMatch('def',${n.n},${i},${m.origIdx})">${m.rightText}${m.rightText.length>70?'...':''}</div>`).join('')}
    </div>
  </div>
  <div id="matchFb-${n.n}" style="margin-top:12px;font-size:13px;font-weight:700;letter-spacing:0.5px;text-align:center;color:var(--teal)"></div>`;
}

let matchSel = {};
function selectMatch(type, num, idx, origIdx) {
  if (type==='word') {
    if (matchSel.wordEl) { const el=document.getElementById(matchSel.wordEl); if(el) el.classList.remove('selected'); }
    matchSel.word = idx; matchSel.wordEl = `mw-${num}-${idx}`;
    document.getElementById(`mw-${num}-${idx}`).classList.add('selected');
  } else {
    if (matchSel.word !== undefined && matchSel.word === origIdx) {
      // Correct match
      document.getElementById(`mw-${num}-${matchSel.word}`).classList.remove('selected');
      document.getElementById(`mw-${num}-${matchSel.word}`).classList.add('matched');
      document.getElementById(`md-${num}-${idx}`).classList.add('matched');
      document.getElementById(`matchFb-${num}`).innerHTML = '✓ Perfect match!';
      document.getElementById(`matchFb-${num}`).style.color = 'var(--green)';
      matchSel = {};
      // Auto-reset after showing success
      setTimeout(() => {
        const fb = document.getElementById(`matchFb-${num}`);
        if(fb) fb.innerHTML = '';
      }, 1200);
    } else {
      // Wrong match
      const el = document.getElementById(`md-${num}-${idx}`);
      el.classList.add('wrong-flash');
      setTimeout(()=>el.classList.remove('wrong-flash'),400);
    }
  }
}

function markLearned(num) {
  if (!state.learned[num]) {
    state.learned[num] = TODAY;
    state.learnedDates[num] = TODAY;
    state.weekActivity[TODAY] = true;
    state.dailyLearned[TODAY] = (state.dailyLearned[TODAY] || 0) + 1;
    save(); showToast('Learned', 'teal'); updateUI();
  } else {
    showToast('Already learned — revisit to master', 'gold');
  }
}

function unlearn(num) {
  if (state.learned[num]) {
    delete state.learned[num];
    state.revisits[num] = 0;
    state.dailyLearned[TODAY] = Math.max(0, (state.dailyLearned[TODAY] || 0) - 1);
    save(); showToast('✓ Reset — Ready to start fresh', 'gold'); updateUI();
    if (currentDetail && currentDetail.n === num) {
      openDetail(num);
    }
  }
}

    <div style="font-size:11px;color:var(--text3)">👆 Tap to open</div>
  </div>`;
  document.body.insertAdjacentHTML('beforeend', html);
  setTimeout(() => {
    const el = document.querySelector('[onclick="openDetail('+nameNum+')"]');
    if(el) el.remove();
  }, 8000);
}

function getMilestones() {
  const learned = Object.keys(state.learned).length;
  const mastered = Object.values(state.revisits).filter(v=>v>=3).length;
  const totalDays = Object.keys(state.learnedDates).length;
  
  return [
    { id: 'first', label: 'First Step', threshold: 1, current: learned, unlocked: learned >= 1 },
    { id: 'five', label: 'Steadfast', threshold: 5, current: learned, unlocked: learned >= 5 },
    { id: 'ten', label: 'Devoted', threshold: 10, current: learned, unlocked: learned >= 10 },
    { id: 'master', label: 'Master One', threshold: 1, current: mastered, unlocked: mastered >= 1 },
    { id: 'streaker', label: 'Seven Day Streak', threshold: 7, current: state.streak, unlocked: state.streak >= 7 },
    { id: 'thirtynames', label: 'Thirty Names', threshold: 30, current: learned, unlocked: learned >= 30 },
    { id: 'allmaster', label: 'Perfect Understanding', threshold: 33, current: mastered, unlocked: mastered >= 33 }
  ];
}

function getNextToReview() {
  const learned = Object.keys(state.learned).filter(n => state.learnedDates[n]);
  if (learned.length === 0) return [];
  
  const today = new Date(TODAY);
  const dueSoon = learned
    .map(numStr => {
      const num = parseInt(numStr);
      const learnedDate = new Date(state.learnedDates[num]);
      const revisits = state.revisits[num] || 0;
      let daysUntilDue;
      
      if (revisits === 0) daysUntilDue = 3 - Math.floor((today - learnedDate) / 86400000);
      else if (revisits === 1) daysUntilDue = 7 - Math.floor((today - learnedDate) / 86400000);
      else if (revisits === 2) daysUntilDue = 14 - Math.floor((today - learnedDate) / 86400000);
      else daysUntilDue = 30 - Math.floor((today - learnedDate) / 86400000);
      
      return { num, daysUntilDue, revisits };
    })
    .filter(item => item.daysUntilDue <= 3 && item.daysUntilDue > -30)
    .sort((a, b) => a.daysUntilDue - b.daysUntilDue)
    .slice(0, 5)
    .map(item => item.num);
  
  return dueSoon;
}

function addToPlaylist(num) {
  if (!state.customPlaylist.includes(num)) {
    state.customPlaylist.push(num); save(); showToast('Added to playlist', 'teal');
  }
}

function addToPlaylistFromDetail() { if(currentDetail) addToPlaylist(currentDetail.n); }

// ------------------------------------------
// SIDEBAR
// ------------------------------------------
function buildSidebarCats() {
  const el = document.getElementById('sidebarCats');
  let html = '';
  Object.entries(CATEGORIES).forEach(([k,c]) => {
    const done = c.names.filter(n=>state.learned[n]).length;
    html += `<div class="cat-chip" onclick="filterByCategory('${k}')">
      <div class="cat-dot" style="background:${c.color}"></div>
      <span>${c.name.split(' ')[0]}</span>
      <div class="cat-count">${done}/${c.names.length}</div>
    </div>`;
  });
  el.innerHTML = html;
}

// ------------------------------------------
// UTILS
// ------------------------------------------
function showToast(msg, type='gold') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast ${type} show`;
  setTimeout(()=>t.classList.remove('show'), 2800);
}

function toggleTheme() {
  document.documentElement.classList.toggle('light');
  document.body.classList.toggle('light');
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('show');
}

function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
}

// ------------------------------------------
// INIT
// ------------------------------------------
checkStreak();
buildSidebarCats();
updateUI();
showPage('home');

// Show notifications
if (state.streak > 1 && !state.weekActivity[TODAY]) {
  setTimeout(()=>showToast(`${state.streak}-day streak — keep it going`, 'streak'), 1200);
}
if (Object.keys(state.learned).length === 0) {
  setTimeout(()=>showToast("Begin with today's name", 'gold'), 1800);
}

// Periodic mood-based notifications every 20 minutes
setInterval(() => {
  const moods = ['anxious','sad','weak','lonely','stressed','guilty','hopeless'];
  const randomMood = moods[Math.floor(Math.random() * moods.length)];
  const matches = NAMES.filter(n => n.moods && n.moods.includes(randomMood));
  if (matches.length > 0) {
    const pick = matches[Math.floor(Math.random() * matches.length)];
    showNotification(`Feeling ${randomMood}?`, `Try reading <strong>${pick.tr}</strong> now`, pick.n);
  }
}, 1200000);
</script>
