  creator:  { name:"Creator & Provider",    icon:"C", color:"#f59e0b", names:[] },
  guardian: { name:"Guardian & Protector",  icon:"G", color:"#2d9c96", names:[] },
  forgiver: { name:"Forgiver & Pardoner",   icon:"F", color:"#94a3b8", names:[] },
  exalted:  { name:"The Exalted & Supreme", icon:"E", color:"#c9a84c", names:[] },
};

// ------------------------------------------
// ALL 99 NAMES
// ------------------------------------------
const NAMES = [
  { n:1, ar:"الرَّحْمَنُ", tr:"Ar-Rahman", en:"The Most Gracious — the One whose mercy is vast and encompasses all of creation without exception.", cat:"mercy", benefits:["Reciting this name brings peace and calm to an anxious heart.","It opens the doors of mercy in one's daily life.","Reminds us that every blessing we have comes from His grace."], reflection:"Every breath we take is a mercy from Ar-Rahman. He did not wait for us to ask — His mercy arrives before any deed of ours.", quran:[{ar:"بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ",tr:"In the name of Allah, the Most Gracious, the Most Merciful.",ref:"Surah Al-Fatiha 1:1"},{ar:"الرَّحْمَٰنُ عَلَى الْعَرْشِ اسْتَوَىٰ",tr:"The Most Gracious rose over the Throne.",ref:"Surah Ta-Ha 20:5"}], mcq:[{q:"What does Ar-Rahman primarily signify?",opts:["Power over all","All-encompassing mercy","The Creator","The Judge"],ans:1},{q:"In which surah's opening verse does Ar-Rahman appear?",opts:["Al-Baqarah","Al-Imran","Al-Fatiha","Ya-Sin"],ans:2}], moods:["anxious","sad","seeking peace","lonely"] },
  { n:2, ar:"الرَّحِيمُ", tr:"Ar-Raheem", en:"The Most Merciful — the One whose mercy is specific, sustained, and especially bestowed upon the believers.", cat:"mercy", benefits:["Strengthens the believer's hope in Allah's personal forgiveness.","A reminder that mercy is not just general but deeply personal.","Brings comfort when feeling unworthy or spiritually distant."], reflection:"While Ar-Rahman's mercy covers all creation, Ar-Raheem's mercy is a special ongoing gift reserved for those who believe and strive.", quran:[{ar:"وَكَانَ بِالْمُؤْمِنِينَ رَحِيمًا",tr:"And He is ever Merciful to the believers.",ref:"Surah Al-Ahzab 33:43"}], mcq:[{q:"How does Ar-Raheem differ from Ar-Rahman?",opts:["It means creator","It is specific mercy for believers","It means all-knowing","It means the Sustainer"],ans:1}], moods:["anxious","seeking forgiveness","lonely","sad"] },
  { n:3, ar:"الْمَلِكُ", tr:"Al-Malik", en:"The King — the One who possesses absolute sovereignty and dominion over all of existence.", cat:"majesty", benefits:["Reminds us that no human authority is ultimate or permanent.","Frees the heart from fear of worldly rulers and powers.","Encourages full submission to Allah alone in all matters."], reflection:"When we feel powerless before people, remembering Al-Malik reminds us that all true power belongs only to Allah.", quran:[{ar:"فَتَعَالَى اللَّهُ الْمَلِكُ الْحَقُّ",tr:"So exalted is Allah, the True King.",ref:"Surah Ta-Ha 20:114"}], mcq:[{q:"Al-Malik means?",opts:["The Merciful","The King","The Creator","The Healer"],ans:1}], moods:["overwhelmed","powerless","anxious"] },
  { n:4, ar:"الْقُدُّوسُ", tr:"Al-Quddus", en:"The Most Holy — the One who is completely pure and far above any imperfection, deficiency, or flaw.", cat:"exalted", benefits:["Inspires purity of heart and sincerity of intention.","Reminds us to purify our deeds before presenting them to Allah.","Brings deep humility by recognizing Allah's absolute perfection."], reflection:"We are imperfect beings standing before a perfectly pure Lord — this is precisely why we must begin every act with seeking His forgiveness.", quran:[{ar:"يُسَبِّحُ لِلَّهِ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ الْمَلِكِ الْقُدُّوسِ",tr:"Whatever is in the heavens and earth glorifies Allah — the King, the Most Holy.",ref:"Surah Al-Jumu'ah 62:1"}], mcq:[{q:"Al-Quddus means?",opts:["The Forgiving","The Sustainer","The Most Holy","The All-Knowing"],ans:2}], moods:["seeking purity","spiritually low","distracted"] },
  { n:5, ar:"السَّلَامُ", tr:"As-Salam", en:"The Source of Peace — the One from whom all true peace flows and who is entirely free from all flaws.", cat:"kindness", benefits:["Reciting this name brings inner tranquility and calm.","Helps during times of conflict, anxiety, or distress.","Reminds us that lasting peace comes only from Allah."], reflection:"We chase peace in people, places, and things — yet As-Salam tells us the source of all peace is Allah Himself.", quran:[{ar:"هُوَ اللَّهُ الَّذِي لَا إِلَٰهَ إِلَّا هُوَ الْمَلِكُ الْقُدُّوسُ السَّلَامُ",tr:"He is Allah, other than whom there is no deity — the King, the Most Holy, the Source of Peace.",ref:"Surah Al-Hashr 59:23"}], mcq:[{q:"As-Salam means?",opts:["The Creator","Source of Peace","The Forgiving","The Generous"],ans:1}], moods:["anxious","stressed","seeking peace","lonely"] },
  { n:6, ar:"الْمُؤْمِنُ", tr:"Al-Mu'min", en:"The Granter of Security — the One who gives safety, affirms the truth of His messengers, and keeps His promises.", cat:"guardian", benefits:["Grants a sense of true safety and security beyond the physical.","Helps those facing fear, uncertainty, or danger.","Strengthens complete trust in Allah's protection."], reflection:"When the world feels unsafe, Al-Mu'min is the reminder that our real security is not in walls or wealth, but in Him alone.", quran:[{ar:"الْمَلِكُ الْقُدُّوسُ السَّلَامُ الْمُؤْمِنُ الْمُهَيْمِنُ",tr:"The King, the Most Holy, the Source of Peace, the Granter of Security, the Overseer.",ref:"Surah Al-Hashr 59:23"}], mcq:[{q:"Al-Mu'min primarily refers to?",opts:["All-Knowing","Granter of Security","The Wise","The Just"],ans:1}], moods:["fearful","anxious","unsafe","worried"] },
  { n:7, ar:"الْمُهَيْمِنُ", tr:"Al-Muhaymin", en:"The Overseer — the One who watches over, protects, and preserves all things with perfect and constant care.", cat:"guardian", benefits:["Strengthens the feeling of being watched over and cared for.","Encourages accountability knowing Allah sees everything.","Brings profound comfort in moments of vulnerability."], reflection:"Nothing slips past Al-Muhaymin. Every tear, every hidden struggle, every silent prayer — He is watching over all of it.", quran:[{ar:"الْمُهَيْمِنُ الْعَزِيزُ الْجَبَّارُ الْمُتَكَبِّرُ",tr:"The Overseer, the Exalted in Might, the Compeller, the Superior.",ref:"Surah Al-Hashr 59:23"}], mcq:[{q:"What does Al-Muhaymin mean?",opts:["The Generous","The Overseer","The Forgiving","The Creator"],ans:1}], moods:["lonely","anxious","feeling unseen","burdened"] },
  { n:8, ar:"الْعَزِيزُ", tr:"Al-Aziz", en:"The Almighty — the One possessing perfect and absolute power who can never be overcome or weakened.", cat:"majesty", benefits:["Inspires strength when facing opposition or hardship.","Reminds us that those who rely on Allah cannot truly be defeated.","Helps when feeling weak, humiliated, or powerless."], reflection:"The believer's strength is not their own — it is borrowed from Al-Aziz. When we lean on Him, we lean on the undefeatable.", quran:[{ar:"وَاللَّهُ عَزِيزٌ حَكِيمٌ",tr:"And Allah is Almighty, All-Wise.",ref:"Surah Al-Baqarah 2:228"}], mcq:[{q:"Al-Aziz means?",opts:["The Generous","The Almighty","The Merciful","The Trustworthy"],ans:1}], moods:["weak","defeated","overwhelmed","powerless"] },
  { n:9, ar:"الْجَبَّارُ", tr:"Al-Jabbar", en:"The Compeller — the One who restores what is broken and whose will cannot be resisted by anyone.", cat:"majesty", benefits:["Provides hope that Allah can restore what is broken in our lives.","Removes arrogance by recognizing the only true compeller is Allah.","Helps in times of injustice and oppression."], reflection:"Al-Jabbar mends broken bones, broken hearts, and broken lives. His compulsion is not cruelty — it is the ultimate restoration.", quran:[{ar:"الْعَزِيزُ الْجَبَّارُ الْمُتَكَبِّرُ",tr:"The Exalted in Might, the Compeller, the Superior.",ref:"Surah Al-Hashr 59:23"}], mcq:[{q:"Al-Jabbar can also mean?",opts:["The Restorer of broken things","The Creator","The Forgiving","The Merciful"],ans:0}], moods:["broken","hopeless","grieving","oppressed"] },
  { n:10, ar:"الْمُتَكَبِّرُ", tr:"Al-Mutakabbir", en:"The Supreme — the One who is rightfully and uniquely above all, the only one deserving of true greatness.", cat:"exalted", benefits:["Removes false pride by acknowledging only Allah's greatness is real.","Inspires deep humility before the Creator.","Helps let go of ego and arrogance in worship and life."], reflection:"Every human's pride is borrowed pride. Al-Mutakabbir is the reminder that true supremacy belongs only to Allah.", quran:[{ar:"الْجَبَّارُ الْمُتَكَبِّرُ ۚ سُبْحَانَ اللَّهِ عَمَّا يُشْرِكُونَ",tr:"The Compeller, the Superior — Glorified is Allah above what they associate with Him.",ref:"Surah Al-Hashr 59:23"}], mcq:[{q:"Al-Mutakabbir means?",opts:["The Gentle","The Supreme","The Forgiving","The Guardian"],ans:1}], moods:["proud","arrogant","spiritually disconnected"] },
  { n:11, ar:"الْخَالِقُ", tr:"Al-Khaliq", en:"The Creator — the One who brings everything into existence from nothing according to His perfect and eternal plan.", cat:"creator", benefits:["Inspires awe of Allah's creative power visible in all nature.","Encourages reflection on creation as a direct path to faith.","Reminds us that we ourselves were created with divine purpose."], reflection:"Look at your own hand — Al-Khaliq made every fingerprint unique. You were not a mistake; you were intentionally crafted.", quran:[{ar:"هُوَ اللَّهُ الْخَالِقُ الْبَارِئُ الْمُصَوِّرُ",tr:"He is Allah, the Creator, the Originator, the Fashioner.",ref:"Surah Al-Hashr 59:24"}], mcq:[{q:"Al-Khaliq refers to?",opts:["The Forgiver","The Creator","The Sustainer","The Wise"],ans:1}], moods:["purposeless","wondering","curious","questioning"] },
  { n:12, ar:"الْبَارِئُ", tr:"Al-Bari", en:"The Originator — the One who creates with perfect distinction, giving each creation its unique form and identity.", cat:"creator", benefits:["Deepens appreciation for the uniqueness of every created thing.","Encourages gratitude for our own individuality and distinctiveness.","Reminds us that Allah's creation has infinite variety."], reflection:"Al-Bari is the one who gave distinct form to each creature. No two snowflakes, no two souls — ever exactly alike.", quran:[{ar:"هُوَ اللَّهُ الْخَالِقُ الْبَارِئُ الْمُصَوِّرُ",tr:"He is Allah, the Creator, the Originator, the Fashioner.",ref:"Surah Al-Hashr 59:24"}], mcq:[{q:"Al-Bari's root meaning relates to?",opts:["Forgiving","Separating and distinguishing creation","Sustaining","Guiding"],ans:1}], moods:["purposeless","curious","self-doubt"] },
  { n:13, ar:"الْمُصَوِّرُ", tr:"Al-Musawwir", en:"The Fashioner — the One who gives shape and unique form to all things in the most perfect and deliberate way.", cat:"creator", benefits:["Encourages gratitude for physical beauty and design in the world.","Inspires creativity as a reflection of divine attributes in us.","Helps overcome body image issues and self-comparison."], reflection:"When you look in the mirror, you are seeing the work of Al-Musawwir. He fashioned your face — it is His art, uniquely yours.", quran:[{ar:"هُوَ الَّذِي يُصَوِّرُكُمْ فِي الْأَرْحَامِ كَيْفَ يَشَاءُ",tr:"He is the one who shapes you in the wombs however He wills.",ref:"Surah Aal-e-Imran 3:6"}], mcq:[{q:"Al-Musawwir means?",opts:["The Healer","The Fashioner of Forms","The Generous","The Protector"],ans:1}], moods:["purposeless","self-doubt","struggling"] },
  { n:14, ar:"الْغَفَّارُ", tr:"Al-Ghaffar", en:"The Repeatedly Forgiving — the One who forgives sins again and again, without limit, no matter how many times one returns.", cat:"forgiver", benefits:["Brings profound relief to those burdened with guilt and shame.","Encourages returning to Allah no matter how many mistakes.","Completely removes despair and hopelessness about past sins."], reflection:"Al-Ghaffar doesn't just forgive once. He forgives the same person, the same sin, the same regret — over and over, without ever tiring.", quran:[{ar:"إِنَّهُ كَانَ غَفَّارًا",tr:"Indeed, He is ever-forgiving.",ref:"Surah Nuh 71:10"}], mcq:[{q:"What makes Al-Ghaffar unique in forgiveness?",opts:["He forgives once only","He forgives repeatedly and continuously","He only forgives major sins","He forgives only the righteous"],ans:1}], moods:["guilty","seeking forgiveness","burdened","hopeless"] },
  { n:15, ar:"الْقَهَّارُ", tr:"Al-Qahhar", en:"The Subduer — the One who overpowers all things absolutely and whose will cannot be resisted by any force.", cat:"majesty", benefits:["Helps when oppressed by others or feeling overpowered.","Reminds us that no power or tyranny stands against Allah.","Reduces crippling fear of worldly powers and authorities."], reflection:"Al-Qahhar subdues pharaohs, empires, and the greatest powers in history. Whatever feels undefeatable to you — it is nothing before Him.", quran:[{ar:"وَهُوَ الْقَاهِرُ فَوْقَ عِبَادِهِ",tr:"And He is the Supreme over His servants.",ref:"Surah Al-An'am 6:18"}], mcq:[{q:"Al-Qahhar means?",opts:["The Generous","The Subduer","The Merciful","The Creator"],ans:1}], moods:["oppressed","powerless","angry at injustice"] },
  { n:16, ar:"الْوَهَّابُ", tr:"Al-Wahhab", en:"The Bestower of Gifts — the One who gives freely and abundantly without expecting anything in return.", cat:"kindness", benefits:["Inspires deep gratitude for every blessing received.","Encourages asking Allah for gifts without hesitation or embarrassment.","Removes miserliness by reflecting on divine generosity."], reflection:"Al-Wahhab gives without being asked, gives without reason, gives without limit. Every good thing in your life is His gift.", quran:[{ar:"رَبَّنَا لَا تُزِغْ قُلُوبَنَا بَعْدَ إِذْ هَدَيْتَنَا وَهَبْ لَنَا مِن لَّدُنكَ رَحْمَةً",tr:"Our Lord, do not let our hearts deviate after You have guided us, and grant us from Yourself mercy.",ref:"Surah Aal-e-Imran 3:8"}], mcq:[{q:"Al-Wahhab means?",opts:["The Forgiver","The Bestower of Gifts","The All-Knowing","The Judge"],ans:1}], moods:["grateful","hopeful","seeking blessings"] },
  { n:17, ar:"الرَّزَّاقُ", tr:"Ar-Razzaq", en:"The Provider — the One who provides all forms of sustenance and provision to every single creation.", cat:"creator", benefits:["Reduces anxiety and stress about livelihood and finances.","Encourages reliance on Allah rather than obsessive worldly planning.","Helps in times of financial difficulty and uncertainty."], reflection:"Ar-Razzaq provides for the ant deep underground and the eagle high in the sky. Your provision is already written — trust Him.", quran:[{ar:"إِنَّ اللَّهَ هُوَ الرَّزَّاقُ ذُو الْقُوَّةِ الْمَتِينُ",tr:"Indeed, it is Allah who is the Provider, the Firm Possessor of Strength.",ref:"Surah Adh-Dhariyat 51:58"}], mcq:[{q:"Ar-Razzaq refers to?",opts:["The Forgiver","The Provider","The All-Seeing","The Wise"],ans:1}], moods:["financial stress","worried","hopeless about future","anxious"] },
  { n:18, ar:"الْفَتَّاحُ", tr:"Al-Fattah", en:"The Opener — the One who opens all doors of provision, mercy, judgment, and guidance that were closed.", cat:"kindness", benefits:["Helps when feeling stuck or when all doors seem closed.","Encourages trust that Allah can open what humans never can.","Brings genuine hope in seemingly hopeless situations."], reflection:"Al-Fattah opens doors that have been shut for years. The door you've been knocking on — He can open it at any moment.", quran:[{ar:"وَهُوَ الْفَتَّاحُ الْعَلِيمُ",tr:"And He is the Opener, the Knowing.",ref:"Surah Saba 34:26"}], mcq:[{q:"Al-Fattah means?",opts:["The Closer","The Opener","The Judge","The Holy"],ans:1}], moods:["stuck","hopeless","seeking breakthrough","frustrated"] },
  { n:19, ar:"الْعَلِيمُ", tr:"Al-Alim", en:"The All-Knowing — the One whose knowledge encompasses everything hidden and apparent, past, present, and future.", cat:"wisdom", benefits:["Brings humility about our own severely limited knowledge.","Encourages sincerity since Allah knows all intentions completely.","Gives comfort that Allah knows our silent struggles without us saying a word."], reflection:"You don't need to explain your situation to Al-Alim. He already knows. The pain you've never said out loud — He knows it perfectly.", quran:[{ar:"وَاللَّهُ بِكُلِّ شَيْءٍ عَلِيمٌ",tr:"And Allah is All-Knowing of everything.",ref:"Surah Al-Baqarah 2:282"}], mcq:[{q:"Al-Alim means?",opts:["The All-Knowing","The Creator","The Generous","The Source of Peace"],ans:0}], moods:["misunderstood","lonely","burdened","anxious"] },
  { n:20, ar:"الْقَابِضُ", tr:"Al-Qabid", en:"The Withholder — the One who withholds and constricts provision and blessings by His perfect and wise decree.", cat:"wisdom", benefits:["Helps understand why blessings are sometimes restricted or delayed.","Builds essential patience during periods of scarcity and difficulty.","Encourages trust in Allah's plan even when life feels constricted."], reflection:"Al-Qabid constricts not to punish but to perfect. Sometimes what is withheld from us is mercy in the most profound disguise.", quran:[{ar:"وَاللَّهُ يَقْبِضُ وَيَبْسُطُ",tr:"And Allah withholds and extends.",ref:"Surah Al-Baqarah 2:245"}], mcq:[{q:"Al-Qabid means?",opts:["The Giver","The Withholder","The Forgiving","The Exalted"],ans:1}], moods:["struggling","in difficulty","confused about fate"] },
  { n:21, ar:"الْبَاسِطُ", tr:"Al-Basit", en:"The Extender — the One who expands provision, mercy, and sustenance abundantly for whom He wills.", cat:"kindness", benefits:["Inspires strong hope for expansion of blessings in life.","Encourages deep gratitude during times of abundance.","Paired with Al-Qabid, helps understand the perfect balance of life."], reflection:"Just as night always gives way to dawn, Al-Basit always follows Al-Qabid. Expansion always comes after constriction — trust the cycle.", quran:[{ar:"وَاللَّهُ يَقْبِضُ وَيَبْسُطُ وَإِلَيْهِ تُرْجَعُونَ",tr:"And Allah withholds and extends, and to Him you will be returned.",ref:"Surah Al-Baqarah 2:245"}], mcq:[{q:"Al-Basit means?",opts:["The Withholder","The Extender","The Creator","The Source of Peace"],ans:1}], moods:["hopeful","grateful","recovering","seeking blessings"] },
  { n:22, ar:"الْخَافِضُ", tr:"Al-Khafid", en:"The Abaser — the One who lowers the arrogant and humbles those who transgress beyond their limits.", cat:"majesty", benefits:["Removes arrogance and false pride from the heart.","Reminds us that worldly status is entirely temporary.","Encourages genuine humility before Allah and people."], reflection:"No matter how high a person rises in arrogance, Al-Khafid can bring them low in an instant. True elevation is only in submission.", quran:[{ar:"تِلْكَ الدَّارُ الْآخِرَةُ نَجْعَلُهَا لِلَّذِينَ لَا يُرِيدُونَ عُلُوًّا فِي الْأَرْضِ",tr:"That home of the Hereafter — We assign it to those who do not desire exaltedness on earth.",ref:"Surah Al-Qasas 28:83"}], mcq:[{q:"Al-Khafid means?",opts:["The Exalter","The Abaser","The Creator","The Guide"],ans:1}], moods:["proud","arrogant","spiritually disconnected"] },
  { n:23, ar:"الرَّافِعُ", tr:"Ar-Rafi", en:"The Exalter — the One who raises the ranks of the believers and elevates the righteous in status.", cat:"majesty", benefits:["Inspires hope that Allah raises whoever He wills in rank.","Encourages sincerity since only Allah can grant true and lasting elevation.","Brings comfort to those who feel overlooked or undervalued."], reflection:"The believer who is humble before Allah will be raised. Ar-Rafi's elevation is the only elevation that truly and permanently lasts.", quran:[{ar:"يَرْفَعِ اللَّهُ الَّذِينَ آمَنُوا مِنكُمْ وَالَّذِينَ أُوتُوا الْعِلْمَ دَرَجَاتٍ",tr:"Allah will raise those who have believed among you and those who were given knowledge by degrees.",ref:"Surah Al-Mujadila 58:11"}], mcq:[{q:"Ar-Rafi means?",opts:["The Lowerer","The Exalter","The Provider","The Holy"],ans:1}], moods:["overlooked","hopeless","weak","disrespected"] },
  { n:24, ar:"الْمُعِزُّ", tr:"Al-Mu'izz", en:"The Honourer — the One who grants honour and dignity to whomever He wills.", cat:"majesty", benefits:["Real honour comes only from Allah, not from status or wealth.","Helps those feeling humiliated or deeply disrespected.","Encourages seeking dignity through righteousness, not worldly position."], reflection:"People chase honour through wealth, fame, and power. But Al-Mu'izz reminds us — true dignity is bestowed only by Allah alone.", quran:[{ar:"قُلِ اللَّهُمَّ مَالِكَ الْمُلْكِ تُؤْتِي الْمُلْكَ مَن تَشَاءُ",tr:"Say: O Allah, Owner of Sovereignty, You give sovereignty to whom You will.",ref:"Surah Aal-e-Imran 3:26"}], mcq:[{q:"Al-Mu'izz means?",opts:["The Dishonorer","The Honourer","The Creator","The Wise"],ans:1}], moods:["humiliated","disrespected","weak","defeated"] },
  { n:25, ar:"الْمُذِلُّ", tr:"Al-Mudhill", en:"The Dishonorer — the One who humiliates and disgraces those who persist in opposing His truth.", cat:"majesty", benefits:["Warns against arrogance and persistent opposition to truth.","Reminds oppressors that disgrace awaits those who do not repent.","Encourages reliance on Allah for protection from humiliation."], reflection:"Those who build their dignity on oppression and falsehood will be humbled. Al-Mudhill is the reminder that disgrace without repentance has a Lord.", quran:[{ar:"وَتُعِزُّ مَن تَشَاءُ وَتُذِلُّ مَن تَشَاءُ",tr:"You honour whom You will and humiliate whom You will.",ref:"Surah Aal-e-Imran 3:26"}], mcq:[{q:"Al-Mudhill is paired with which name?",opts:["Al-Ghaffar","Al-Mu'izz","Al-Khaliq","Al-Fattah"],ans:1}], moods:["angry at injustice","oppressed","powerless"] },
  { n:26, ar:"السَّمِيعُ", tr:"As-Sami", en:"The All-Hearing — the One who hears every sound, whisper, thought, and prayer without a single exception.", cat:"wisdom", benefits:["Encourages du'a knowing Allah hears absolutely everything.","Removes loneliness — your voice is always perfectly heard.","Promotes mindfulness of the words we speak."], reflection:"You don't need a microphone or an audience for As-Sami. Every whispered prayer in the darkest night is heard perfectly by Him.", quran:[{ar:"إِنَّهُ سَمِيعٌ قَرِيبٌ",tr:"Indeed, He is All-Hearing, Near.",ref:"Surah Saba 34:50"}], mcq:[{q:"As-Sami means?",opts:["All-Seeing","All-Hearing","All-Knowing","The Guide"],ans:1}], moods:["lonely","unheard","sad","anxious"] },
  { n:27, ar:"الْبَصِيرُ", tr:"Al-Basir", en:"The All-Seeing — the One who sees all things, visible and hidden, in every corner of existence.", cat:"wisdom", benefits:["Brings accountability — Allah sees every single action we do.","Provides comfort that our unseen struggles are witnessed by Him.","Encourages sincerity and quality in our private deeds."], reflection:"Every act of kindness done in secret, every tear shed alone — Al-Basir sees it all. Nothing is ever truly hidden from His sight.", quran:[{ar:"إِنَّ اللَّهَ كَانَ سَمِيعًا بَصِيرًا",tr:"Indeed, Allah is ever All-Hearing and All-Seeing.",ref:"Surah An-Nisa 4:58"}], mcq:[{q:"Al-Basir means?",opts:["All-Hearing","All-Knowing","All-Seeing","The Wise"],ans:2}], moods:["feeling unseen","lonely","burdened","unheard"] },
  { n:28, ar:"الْحَكَمُ", tr:"Al-Hakam", en:"The Judge — the One who judges with absolute perfect justice and whose ruling is always final and correct.", cat:"wisdom", benefits:["Provides deep peace when human justice completely fails.","Encourages leaving personal revenge entirely to Allah.","Removes anxiety about unresolved injustice in the world."], reflection:"When courts fail and oppressors escape, Al-Hakam remains. No case is ever truly closed before the ultimate Judge.", quran:[{ar:"أَفَغَيْرَ اللَّهِ أَبْتَغِي حَكَمًا",tr:"Then is it other than Allah I should seek as judge?",ref:"Surah Al-An'am 6:114"}], mcq:[{q:"Al-Hakam means?",opts:["The Merciful","The Judge","The Provider","The Creator"],ans:1}], moods:["angry at injustice","oppressed","grieving","troubled"] },
  { n:29, ar:"الْعَدْلُ", tr:"Al-Adl", en:"The Utterly Just — the One who is perfectly fair in all His decrees and judgements without any bias or error.", cat:"wisdom", benefits:["Builds deep trust that everything happens with divine fairness.","Helps accept hardship as part of a perfectly just and wise plan.","Encourages justice and fairness in our own daily dealings."], reflection:"Al-Adl means not a single atom of injustice exists in any of Allah's decrees — even when we cannot fully see the wisdom behind them.", quran:[{ar:"وَتَمَّتْ كَلِمَتُ رَبِّكَ صِدْقًا وَعَدْلًا",tr:"The word of your Lord is complete in truth and justice.",ref:"Surah Al-An'am 6:115"}], mcq:[{q:"Al-Adl means?",opts:["The Forgiving","The Utterly Just","The Creator","The Sustainer"],ans:1}], moods:["confused about fate","troubled","hopeless","questioning"] },
  { n:30, ar:"اللَّطِيفُ", tr:"Al-Latif", en:"The Subtle and Kind — the One aware of the finest details whose kindness reaches in ways completely unseen.", cat:"kindness", benefits:["Encourages noticing and appreciating the small blessings in life.","Provides comfort that Allah's care is precise, personal, and intimate.","Helps in moments when no one else seems to understand your situation."], reflection:"Al-Latif knows what you need before you do. His kindness arrives in ways you didn't plan, through doors you didn't even knock on.", quran:[{ar:"اللَّهُ لَطِيفٌ بِعِبَادِهِ يَرْزُقُ مَن يَشَاءُ",tr:"Allah is Subtle with His servants; He provides for whom He wills.",ref:"Surah Ash-Shura 42:19"}], mcq:[{q:"Al-Latif means?",opts:["The Generous","The Subtle and Kind","The Judge","The All-Seeing"],ans:1}], moods:["anxious","lonely","overlooked","sad"] },
  { n:31, ar:"الْخَبِيرُ", tr:"Al-Khabir", en:"The All-Aware — the One who has complete and deep awareness of all inner and outer realities.", cat:"wisdom", benefits:["Promotes honesty since Allah knows our innermost states fully.","Brings comfort that our hidden efforts and struggles are known.","Encourages sincerity in all actions over outward performance."], reflection:"Al-Khabir is not just aware of what you do — He is aware of precisely why you do it. Your intention is never hidden from Him.", quran:[{ar:"إِنَّ اللَّهَ خَبِيرٌ بِمَا تَعْمَلُونَ",tr:"Indeed, Allah is All-Aware of what you do.",ref:"Surah Al-Hujurat 49:13"}], mcq:[{q:"Al-Khabir means?",opts:["All-Hearing","All-Seeing","All-Aware","The Wise"],ans:2}], moods:["burdened","misunderstood","lonely","seeking validation"] },
  { n:32, ar:"الْحَلِيمُ", tr:"Al-Halim", en:"The Forbearing — the One who does not hasten punishment despite witnessing all sin and disobedience.", cat:"mercy", benefits:["Brings relief knowing Allah is enormously patient with our sins.","Encourages us to be forbearing and patient with others.","Reduces guilt when returning to Allah after a long absence."], reflection:"Al-Halim watches us sin, delay, and return again and again — and still does not rush to punish. His forbearance is our greatest lifeline.", quran:[{ar:"وَاعْلَمُوا أَنَّ اللَّهَ غَفُورٌ حَلِيمٌ",tr:"And know that Allah is Forgiving and Forbearing.",ref:"Surah Al-Baqarah 2:235"}], mcq:[{q:"Al-Halim means?",opts:["The Creator","The Forbearing","The Exalted","The Provider"],ans:1}], moods:["guilty","burdened","seeking forgiveness","hopeless"] },
  { n:33, ar:"الْعَظِيمُ", tr:"Al-Azim", en:"The Magnificent — the One whose greatness is beyond all comprehension and surpasses absolutely everything.", cat:"exalted", benefits:["Puts all human problems in their true and tiny perspective.","Inspires profound awe and gratitude in worship.","Deepens the experience of prayer by focusing on Allah's magnificence."], reflection:"When you say Subhanallah Al-Azim in ruku', you are acknowledging a greatness so vast it makes galaxies seem like specks of dust.", quran:[{ar:"وَهُوَ الْعَلِيُّ الْعَظِيمُ",tr:"And He is the Most High, the Most Magnificent.",ref:"Surah Al-Baqarah 2:255"}], mcq:[{q:"Al-Azim means?",opts:["The Forgiving","The Magnificent","The Patient","The Sustainer"],ans:1}], moods:["spiritually low","distracted","purposeless"] },
  { n:34, ar:"الْغَفُورُ", tr:"Al-Ghafur", en:"The All-Forgiving — the One who forgives all sins completely and covers them without leaving any trace.", cat:"forgiver", benefits:["Removes all despair about the weight of accumulated sins.","Encourages returning to Allah after any failure, however great.","Grants genuine hope to those who feel most unworthy of mercy."], reflection:"Al-Ghafur doesn't just forgive — He covers. Your sins are not just erased; they are hidden so completely even the angels may not record them.", quran:[{ar:"وَهُوَ الْغَفُورُ الْوَدُودُ",tr:"And He is the All-Forgiving, the Most Loving.",ref:"Surah Al-Buruj 85:14"}], mcq:[{q:"Al-Ghafur means?",opts:["The Provider","The All-Forgiving","The Judge","The Holy"],ans:1}], moods:["guilty","seeking forgiveness","burdened","hopeless"] },
  { n:35, ar:"الشَّكُورُ", tr:"Ash-Shakur", en:"The Most Appreciative — the One who appreciates even the smallest good deeds and rewards them beyond measure.", cat:"kindness", benefits:["Encourages performing small deeds consistently with sincerity.","Gives hope that no good act ever goes unnoticed by Allah.","Removes the discouraging feeling that small efforts are wasted."], reflection:"Ash-Shakur rewards a single small act of kindness with paradise. He notices what no human eye would even think to observe.", quran:[{ar:"إِنَّ اللَّهَ شَاكِرٌ عَلِيمٌ",tr:"Indeed, Allah is Appreciative and All-Knowing.",ref:"Surah Al-Baqarah 2:158"}], mcq:[{q:"Ash-Shakur means?",opts:["The All-Seeing","The Most Appreciative","The Forgiving","The Exalted"],ans:1}], moods:["hopeless","purposeless","spiritually low","discouraged"] },
  { n:36, ar:"الْعَلِيُّ", tr:"Al-Ali", en:"The Most High — the One who is supreme above all of creation in essence, status, power, and every attribute.", cat:"exalted", benefits:["Reminds us to direct our highest aspirations toward what is truly high.","Reduces unhealthy attachment to worldly status and prestige.","Encourages raising our du'a to the highest, the Most High Himself."], reflection:"Al-Ali is so high that lowering ourselves completely before Him is paradoxically the highest position a human being can ever reach.", quran:[{ar:"وَهُوَ الْعَلِيُّ الْعَظِيمُ",tr:"And He is the Most High, the Most Magnificent.",ref:"Surah Al-Baqarah 2:255"}], mcq:[{q:"Al-Ali means?",opts:["The Forgiving","The Most High","The Provider","The King"],ans:1}], moods:["distracted","spiritually low","purposeless"] },
  { n:37, ar:"الْكَبِيرُ", tr:"Al-Kabir", en:"The Most Great — the One who is immeasurably great in every attribute and above all possible comparison.", cat:"exalted", benefits:["Inspires profound awe during prayer and remembrance of Allah.","Reminds us of our smallness and Allah's immensity.","Encourages saying Allahu Akbar with its full weight and meaning."], reflection:"Every time you say Allahu Akbar, you are declaring: whatever I fear, whatever I love, whatever I pursue — Allah is greater than all of it combined.", quran:[{ar:"وَأَنَّ اللَّهَ هُوَ الْعَلِيُّ الْكَبِيرُ",tr:"And that Allah is the Most High, the Most Great.",ref:"Surah Al-Hajj 22:62"}], mcq:[{q:"Al-Kabir means?",opts:["The Most Great","The Forgiving","The Patient","The Creator"],ans:0}], moods:["spiritually low","distracted","purposeless"] },
  { n:38, ar:"الْحَفِيظُ", tr:"Al-Hafiz", en:"The Preserver — the One who preserves and protects all things in existence with absolute and perfect care.", cat:"guardian", benefits:["Builds deep trust in Allah's protection over all of life and deeds.","Encourages entrusting loved ones entirely to Allah's care.","Removes excessive fear and worry about what might go wrong."], reflection:"Your deeds, your children, your soul — all held in the hands of Al-Hafiz. Nothing He preserves can ever be truly lost.", quran:[{ar:"وَرَبُّكَ عَلَىٰ كُلِّ شَيْءٍ حَفِيظٌ",tr:"And your Lord is a Preserver over all things.",ref:"Surah Saba 34:21"}], mcq:[{q:"Al-Hafiz means?",opts:["The Provider","The Preserver","The Judge","The Forgiving"],ans:1}], moods:["anxious","fearful","worried","stressed"] },
  { n:39, ar:"الْمُقِيتُ", tr:"Al-Muqit", en:"The Nourisher — the One who maintains, nourishes, and sustains all of creation in every moment.", cat:"creator", benefits:["Builds complete reliance on Allah for all nourishment.","Removes anxiety about basic needs being met.","Encourages sincere gratitude for every single meal and breath."], reflection:"Al-Muqit nourishes the body, the soul, and the mind. Every bite of food, every breath of air — it all flows from Him.", quran:[{ar:"وَكَانَ اللَّهُ عَلَىٰ كُلِّ شَيْءٍ مُّقِيتًا",tr:"And Allah is Able to maintain and witness all things.",ref:"Surah An-Nisa 4:85"}], mcq:[{q:"Al-Muqit means?",opts:["The Nourisher","The Forgiver","The Exalted","The King"],ans:0}], moods:["grateful","anxious about provision","hopeful"] },
  { n:40, ar:"الْحَسِيبُ", tr:"Al-Hasib", en:"The Reckoner — the One who takes perfect account of all things and is sufficient for everything His servant needs.", cat:"wisdom", benefits:["Encourages self-accountability before the great final reckoning.","Reminds us Allah is entirely sufficient without any partner.","Promotes honesty and integrity in all dealings."], reflection:"Al-Hasib keeps a perfect account. Not a good deed, not a bad deed, not a whispered intention — is ever missing from His record.", quran:[{ar:"وَكَفَىٰ بِاللَّهِ حَسِيبًا",tr:"And sufficient is Allah as Reckoner.",ref:"Surah An-Nisa 4:6"}], mcq:[{q:"Al-Hasib means?",opts:["The Reckoner","The Most Holy","The Provider","The Forgiving"],ans:0}], moods:["troubled","seeking accountability","spiritually low"] },
  { n:41, ar:"الْجَلِيلُ", tr:"Al-Jalil", en:"The Majestic — the One who combines all attributes of greatness, beauty, and absolute perfection.", cat:"exalted", benefits:["Inspires the deepest reverence and respect in worship.","Encourages approaching Allah with both love and profound awe.","Deepens the quality, presence, and focus of prayer."], reflection:"Al-Jalil's majesty is not intimidating — it is magnetic. The more you know of it, the more irresistibly you are drawn toward it.", quran:[{ar:"وَيَبْقَىٰ وَجْهُ رَبِّكَ ذُو الْجَلَالِ وَالْإِكْرَامِ",tr:"And there will remain the Face of your Lord, Owner of Majesty and Honour.",ref:"Surah Ar-Rahman 55:27"}], mcq:[{q:"Al-Jalil means?",opts:["The Provider","The Majestic","The Forgiving","The Patient"],ans:1}], moods:["spiritually low","distracted","disconnected"] },
  { n:42, ar:"الْكَرِيمُ", tr:"Al-Karim", en:"The Most Generous — the One who gives abundantly and whose generosity has absolutely no end or condition.", cat:"kindness", benefits:["Encourages asking Allah freely, openly, and without any embarrassment.","Inspires genuine generosity in our own character and dealings.","Removes the crippling feeling of unworthiness when making du'a."], reflection:"Al-Karim is generous to those who ask and to those who don't. You cannot exhaust His giving — the more you ask, the more He loves to give.", quran:[{ar:"يَا أَيُّهَا الْإِنسَانُ مَا غَرَّكَ بِرَبِّكَ الْكَرِيمِ",tr:"O mankind, what has deceived you concerning your Lord, the Most Generous?",ref:"Surah Al-Infitar 82:6"}], mcq:[{q:"Al-Karim means?",opts:["The Most Generous","The Forgiver","The All-Seeing","The Creator"],ans:0}], moods:["hopeless","seeking blessings","grateful","financial stress"] },
  { n:43, ar:"الرَّقِيبُ", tr:"Ar-Raqib", en:"The Watchful — the One who permanently watches over all things without a single moment of inattention.", cat:"guardian", benefits:["Builds God-consciousness (taqwa) naturally in daily life.","Encourages honesty and integrity in private moments.","Reduces harmful behaviour done secretly away from people."], reflection:"Ar-Raqib never blinks, never sleeps, never looks away. Every moment of your life is under His watchful eye — and that is mercy, not threat.", quran:[{ar:"إِنَّ اللَّهَ كَانَ عَلَيْكُمْ رَقِيبًا",tr:"Indeed Allah is ever watchful over you.",ref:"Surah An-Nisa 4:1"}], mcq:[{q:"Ar-Raqib means?",opts:["The Provider","The Watchful","The Forgiving","The Creator"],ans:1}], moods:["spiritually disconnected","tempted","anxious"] },
  { n:44, ar:"الْمُجِيبُ", tr:"Al-Mujib", en:"The Responsive — the One who answers every prayer and call without fail in the most perfect way.", cat:"kindness", benefits:["Encourages making du'a consistently and with full conviction.","Removes the discouraging feeling that prayers go completely unheard.","Builds deep trust that Allah responds — though not always as we expect."], reflection:"Al-Mujib has answered every prayer you ever made — sometimes with yes, sometimes with better, sometimes with a blessing not yet visible.", quran:[{ar:"إِنَّ رَبِّي قَرِيبٌ مُّجِيبٌ",tr:"Indeed, my Lord is Near and Responsive.",ref:"Surah Hud 11:61"}], mcq:[{q:"Al-Mujib means?",opts:["The Judge","The Responsive","The Creator","The Holy"],ans:1}], moods:["anxious","hopeless","lonely","seeking peace"] },
  { n:45, ar:"الْوَاسِعُ", tr:"Al-Wasi", en:"The All-Encompassing — the One whose knowledge, mercy, and generosity are boundless and completely unlimited.", cat:"mercy", benefits:["Reminds us no situation is ever too big or too far for Allah.","Encourages expansive and bold hope in Allah's mercy.","Reduces the claustrophobic feeling of being trapped with no way out."], reflection:"Al-Wasi's mercy has no geography. No matter how far you have strayed, you are never outside the reach of His encompassing grace.", quran:[{ar:"إِنَّ اللَّهَ وَاسِعٌ عَلِيمٌ",tr:"Indeed, Allah is All-Encompassing and All-Knowing.",ref:"Surah Al-Baqarah 2:115"}], mcq:[{q:"Al-Wasi means?",opts:["The Forgiving","The All-Encompassing","The Exalted","The Patient"],ans:1}], moods:["hopeless","stuck","guilty","anxious"] },
  { n:46, ar:"الْحَكِيمُ", tr:"Al-Hakim", en:"The All-Wise — the One who places everything in its most perfect place with complete and absolute wisdom.", cat:"wisdom", benefits:["Builds genuine acceptance of Allah's decree in all circumstances.","Helps understand that what seems painful may contain profound wisdom.","Encourages trusting Allah's plan even when it makes no sense to us."], reflection:"Every hardship, every delay, every 'no' — Al-Hakim placed it there with wisdom you may not understand today but will one day recognise.", quran:[{ar:"وَاللَّهُ عَزِيزٌ حَكِيمٌ",tr:"And Allah is Almighty, All-Wise.",ref:"Surah Al-Baqarah 2:228"}], mcq:[{q:"Al-Hakim means?",opts:["The All-Wise","The Generous","The Forgiving","The Provider"],ans:0}], moods:["confused about fate","troubled","questioning","angry at injustice"] },
  { n:47, ar:"الْوَدُودُ", tr:"Al-Wadud", en:"The Most Loving — the One whose love for His creation is pure, limitless, and entirely unconditional.", cat:"mercy", benefits:["Reminds us that Allah's love is real, direct, and deeply personal.","Helps those who feel unloved, abandoned, or unworthy of love.","Inspires love of others as a reflection of divine love in us."], reflection:"Human love is limited and conditional. Al-Wadud's love for you existed before you were born and continues regardless of every mistake.", quran:[{ar:"وَهُوَ الْغَفُورُ الْوَدُودُ",tr:"And He is the Forgiving, the Most Loving.",ref:"Surah Al-Buruj 85:14"}], mcq:[{q:"Al-Wadud means?",opts:["The Creator","The Most Loving","The Judge","The Sustainer"],ans:1}], moods:["unloved","lonely","heartbroken","sad"] },
  { n:48, ar:"الْمَجِيدُ", tr:"Al-Majid", en:"The All-Glorious — the One whose glory is vast and combines perfect majesty with overflowing generosity.", cat:"exalted", benefits:["Deepens the quality and meaning of salawat upon the Prophet.","Inspires profound awe and reverence in worship.","Encourages gratitude for being in relationship with so glorious a Lord."], reflection:"Al-Majid's glory is not distant and cold — it is warm and generous. His greatness flows toward you, not away from you.", quran:[{ar:"إِنَّهُ حَمِيدٌ مَّجِيدٌ",tr:"Indeed, He is Praiseworthy and All-Glorious.",ref:"Surah Hud 11:73"}], mcq:[{q:"Al-Majid means?",opts:["The Patient","The All-Glorious","The Creator","The Forgiving"],ans:1}], moods:["spiritually low","distracted","disconnected"] },
  { n:49, ar:"الْبَاعِثُ", tr:"Al-Ba'ith", en:"The Resurrector — the One who will raise all people from the dead on the Day of Judgement.", cat:"majesty", benefits:["Strengthens firm belief in the Day of Resurrection.","Encourages real accountability in all deeds.","Provides powerful hope that death is not the end."], reflection:"Every living thing that dies will be raised by Al-Ba'ith. Death is not an ending — it is a pause before the eternal beginning.", quran:[{ar:"وَأَنَّ اللَّهَ يَبْعَثُ مَن فِي الْقُبُورِ",tr:"And that Allah will resurrect those in the graves.",ref:"Surah Al-Hajj 22:7"}], mcq:[{q:"Al-Ba'ith means?",opts:["The Creator","The Resurrector","The Forgiving","The Provider"],ans:1}], moods:["grieving","hopeless","questioning","fearful of death"] },
  { n:50, ar:"الشَّهِيدُ", tr:"Ash-Shahid", en:"The Witness — the One who witnesses all things at all times and in every place without exception.", cat:"wisdom", benefits:["Promotes complete accountability and deep sincerity.","Removes the need for others to validate our deeds.","Encourages good, sincere behaviour even in total private."], reflection:"Ash-Shahid was present at every moment of your life even before you were aware of it. He witnessed your first breath and every heartbeat.", quran:[{ar:"وَاللَّهُ عَلَىٰ كُلِّ شَيْءٍ شَهِيدٌ",tr:"And Allah is Witness over all things.",ref:"Surah Al-Buruj 85:9"}], mcq:[{q:"Ash-Shahid means?",opts:["The Forgiving","The Witness","The Provider","The Exalted"],ans:1}], moods:["seeking validation","lonely","purposeless"] },
  { n:51, ar:"الْحَقُّ", tr:"Al-Haqq", en:"The Truth — the One who is the ultimate reality and whose existence is the only absolute and certain truth.", cat:"exalted", benefits:["Grounds faith in unshakeable certainty and reality.","Encourages seeking truth in all matters of life and religion.","Provides stability and grounding when everything else feels uncertain."], reflection:"In a world full of illusions and falsehoods, Al-Haqq is the one unshakeable reality. Everything else will pass. He will not.", quran:[{ar:"فَتَعَالَى اللَّهُ الْمَلِكُ الْحَقُّ",tr:"So exalted is Allah, the True King.",ref:"Surah Ta-Ha 20:114"}], mcq:[{q:"Al-Haqq means?",opts:["The Forgiving","The Truth","The Provider","The Guide"],ans:1}], moods:["confused","questioning","spiritually disconnected"] },
  { n:52, ar:"الْوَكِيلُ", tr:"Al-Wakil", en:"The Trustee — the One who is the best disposer of all affairs and the ultimate guardian to rely upon completely.", cat:"guardian", benefits:["Encourages full and complete reliance on Allah (tawakkul).","Reduces debilitating anxiety about outcomes and future events.","Frees the believer from obsessive need for control."], reflection:"When you say HasbunAllah wa ni'mal wakil — Allah is sufficient and what an excellent trustee — you let go of a burden never meant for you.", quran:[{ar:"وَتَوَكَّلْ عَلَى اللَّهِ ۚ وَكَفَىٰ بِاللَّهِ وَكِيلًا",tr:"And rely upon Allah; and sufficient is Allah as Trustee.",ref:"Surah Al-Ahzab 33:3"}], mcq:[{q:"Al-Wakil means?",opts:["The Forgiving","The Trustee","The Exalted","The Creator"],ans:1}], moods:["anxious","stressed","overwhelmed","worried"] },
  { n:53, ar:"الْقَوِيُّ", tr:"Al-Qawiyy", en:"The All-Powerful — the One whose power is absolute and can never be weakened, diminished, or challenged.", cat:"majesty", benefits:["Strengthens the believer when facing seemingly powerful enemies.","Encourages drawing strength from Allah rather than worldly sources.","Provides deep courage when facing seemingly impossible hardship."], reflection:"Al-Qawiyy's power is unlike the power of armies or governments — it never tires, cannot be overthrown, and has absolutely no limit.", quran:[{ar:"إِنَّ اللَّهَ قَوِيٌّ عَزِيزٌ",tr:"Indeed, Allah is Strong and Exalted in Might.",ref:"Surah Al-Mujadila 58:21"}], mcq:[{q:"Al-Qawiyy means?",opts:["The All-Powerful","The Provider","The Forgiver","The Wise"],ans:0}], moods:["weak","powerless","defeated","overwhelmed"] },
  { n:54, ar:"الْمَتِينُ", tr:"Al-Matin", en:"The Firm — the One whose strength is absolutely firm, completely unwavering, and unaffected by anything whatsoever.", cat:"majesty", benefits:["Builds completely unwavering trust in Allah's perfect dependability.","Provides stability, solidity, and groundedness in uncertain times.","Encourages building one's entire life on Allah's firm and unshakeable foundation."], reflection:"Al-Matin never wavers. When everything around you shakes and crumbles, the One you are holding onto absolutely does not.", quran:[{ar:"إِنَّ اللَّهَ هُوَ الرَّزَّاقُ ذُو الْقُوَّةِ الْمَتِينُ",tr:"Indeed, Allah is the Provider, Possessor of firm strength.",ref:"Surah Adh-Dhariyat 51:58"}], mcq:[{q:"Al-Matin means?",opts:["The Forgiving","The Firm","The All-Knowing","The Merciful"],ans:1}], moods:["anxious","uncertain","overwhelmed","stressed"] },
  { n:55, ar:"الْوَلِيُّ", tr:"Al-Waliyy", en:"The Protecting Friend — the One who is the close guardian and most loyal ally of the believers.", cat:"guardian", benefits:["Provides the deepest comfort during loneliness and isolation.","Encourages seeking ever-greater closeness to Allah.","Reminds us we are never without a powerful and loyal friend."], reflection:"Al-Waliyy is not a distant overseer — He is a close, loyal friend. The believer who turns to Him finds the most faithful ally imaginable.", quran:[{ar:"وَهُوَ يَتَوَلَّى الصَّالِحِينَ",tr:"And He is the ally of the righteous.",ref:"Surah Al-A'raf 7:196"}], mcq:[{q:"Al-Waliyy means?",opts:["The Creator","The Protecting Friend","The Judge","The Exalted"],ans:1}], moods:["lonely","anxious","seeking peace","unloved"] },
  { n:56, ar:"الْحَمِيدُ", tr:"Al-Hamid", en:"The Praiseworthy — the One who is deserving of all praise by virtue of His absolutely perfect attributes.", cat:"exalted", benefits:["Enriches the meaning and weight of Alhamdulillah.","Encourages gratitude as a constant and natural state of the heart.","Reminds us that praise belongs to Allah even in the depths of difficulty."], reflection:"Al-Hamid is praised not because He demands it — but because He is simply and completely worthy of every single praise.", quran:[{ar:"إِنَّ اللَّهَ لَغَنِيٌّ حَمِيدٌ",tr:"Indeed, Allah is Self-Sufficient and Praiseworthy.",ref:"Surah Luqman 31:26"}], mcq:[{q:"Al-Hamid means?",opts:["The Forgiving","The Praiseworthy","The Patient","The Provider"],ans:1}], moods:["grateful","spiritually low","distracted"] },
  { n:57, ar:"الْمُحْصِي", tr:"Al-Muhsi", en:"The All-Enumerating — the One who keeps perfect count of every single thing in existence without missing anything.", cat:"wisdom", benefits:["Promotes sincerity in the smallest and most private deeds.","Encourages consistency knowing every act is perfectly counted.","Removes the discouraging feeling that tiny good deeds don't matter."], reflection:"Al-Muhsi counted every grain of sand, every leaf on every tree, every thought you ever had. Nothing whatsoever escapes His count.", quran:[{ar:"وَأَحْصَىٰ كُلَّ شَيْءٍ عَدَدًا",tr:"And He has enumerated all things in number.",ref:"Surah Al-Jinn 72:28"}], mcq:[{q:"Al-Muhsi means?",opts:["The Generous","The All-Enumerating","The Forgiving","The Creator"],ans:1}], moods:["purposeless","spiritually low","discouraged"] },
  { n:58, ar:"الْمُبْدِئُ", tr:"Al-Mubdi", en:"The Originator — the One who brings creation into existence for the very first time from absolute nothing.", cat:"creator", benefits:["Strengthens belief in creation from nothing as a divine act.","Inspires profound wonder at the very origin of the universe.","Encourages gratitude for the gift of existence itself."], reflection:"Al-Mubdi started something from absolutely nothing — no blueprint, no material, no assistant. That beginning is beyond all imagination.", quran:[{ar:"إِنَّهُ هُوَ يُبْدِئُ وَيُعِيدُ",tr:"Indeed, it is He who originates and repeats.",ref:"Surah Al-Buruj 85:13"}], mcq:[{q:"Al-Mubdi means?",opts:["The Originator","The Forgiver","The Provider","The Patient"],ans:0}], moods:["curious","wondering","purposeless","questioning"] },
  { n:59, ar:"الْمُعِيدُ", tr:"Al-Mu'id", en:"The Restorer — the One who will bring all creation back after its end, restoring all that has ceased to exist.", cat:"creator", benefits:["Strengthens belief in the resurrection and life after death.","Provides genuine comfort and hope about death.","Encourages reflection on the temporary nature of this life."], reflection:"Al-Mu'id will restore what was. Every soul that ever existed will be brought back — perfectly — by the One who first made them.", quran:[{ar:"إِنَّهُ هُوَ يُبْدِئُ وَيُعِيدُ",tr:"Indeed, it is He who originates and repeats.",ref:"Surah Al-Buruj 85:13"}], mcq:[{q:"Al-Mu'id means?",opts:["The Originator","The Restorer","The Provider","The All-Knowing"],ans:1}], moods:["grieving","hopeless","fearful of death"] },
  { n:60, ar:"الْمُحْيِي", tr:"Al-Muhyi", en:"The Giver of Life — the One who gives life to all living things and who can restore life after death.", cat:"creator", benefits:["Deepens heartfelt gratitude for the extraordinary gift of life.","Provides hope that spiritually dead and hardened hearts can be revived.","Encourages actively seeking spiritual renewal and awakening."], reflection:"Al-Muhyi can revive a dead heart the way He revives dead earth with rain. If your heart feels lifeless, He is the only answer.", quran:[{ar:"كَيْفَ يُحْيِي الْأَرْضَ بَعْدَ مَوْتِهَا",tr:"How He revives the earth after its lifelessness.",ref:"Surah Ar-Rum 30:50"}], mcq:[{q:"Al-Muhyi means?",opts:["The Giver of Life","The Provider","The Forgiver","The Exalted"],ans:0}], moods:["spiritually low","hopeless","burdened","disconnected"] },
  { n:61, ar:"الْمُمِيتُ", tr:"Al-Mumit", en:"The Creator of Death — the One who causes death to all living things at their appointed and precise time.", cat:"majesty", benefits:["Encourages constant and sincere preparation for death.","Reminds us that life is a trust from Allah, not a permanent possession.","Promotes living with urgency, intentionality, and divine purpose."], reflection:"Al-Mumit is not frightening — He is the reminder that every moment is precious. Death is not His cruelty; it is His wisdom calling us home.", quran:[{ar:"الَّذِي خَلَقَ الْمَوْتَ وَالْحَيَاةَ لِيَبْلُوَكُمْ",tr:"He who created death and life to test you as to which of you is best in deed.",ref:"Surah Al-Mulk 67:2"}], mcq:[{q:"Al-Mumit means?",opts:["The Giver of Life","The Creator of Death","The Provider","The Forgiving"],ans:1}], moods:["fearful of death","purposeless","questioning"] },
  { n:62, ar:"الْحَيُّ", tr:"Al-Hayy", en:"The Ever-Living — the One who is eternally alive whose life has absolutely no beginning and no end.", cat:"exalted", benefits:["Grounds faith in a living, present, and personally engaged God.","Provides comfort that Allah is never absent, distant, or gone.","Enriches and deepens the experience of reciting Ayat al-Kursi."], reflection:"Every being that lives will one day die — except Al-Hayy. He was before all life and will remain after all life. He alone truly lives.", quran:[{ar:"اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ",tr:"Allah — there is no deity except Him, the Ever-Living, the Sustainer of existence.",ref:"Surah Al-Baqarah 2:255"}], mcq:[{q:"Al-Hayy means?",opts:["The Provider","The Ever-Living","The Forgiving","The Exalted"],ans:1}], moods:["spiritually disconnected","questioning","purposeless"] },
  { n:63, ar:"الْقَيُّومُ", tr:"Al-Qayyum", en:"The Sustainer of All Existence — the One who independently sustains all creation and upon whom everything absolutely depends.", cat:"exalted", benefits:["Deepens understanding of our absolute and total dependence on Allah.","Encourages releasing worldly attachments and false independence.","Strengthens the impact and experience of Ayat al-Kursi."], reflection:"Al-Qayyum sustains every atom in the universe every single moment. If His sustaining stopped for one instant, all existence would simply vanish.", quran:[{ar:"اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ",tr:"Allah — there is no deity except Him, the Ever-Living, the Sustainer of existence.",ref:"Surah Al-Baqarah 2:255"}], mcq:[{q:"Al-Qayyum means?",opts:["The Forgiving","The Sustainer of All Existence","The Creator","The Wise"],ans:1}], moods:["spiritually disconnected","purposeless","questioning"] },
  { n:64, ar:"الْوَاجِدُ", tr:"Al-Wajid", en:"The All-Perceiving — the One who finds whatever He wills and who lacks absolutely nothing.", cat:"exalted", benefits:["Removes the illusion that we can ever hide our true state from Allah.","Encourages complete and total honesty in worship and du'a.","Builds trust that Allah lacks nothing and needs nothing from us."], reflection:"Al-Wajid finds what He seeks. You cannot hide need from Him, nor can you surprise Him. He already knows and already has the solution.", quran:[{ar:"وَوَجَدَكَ ضَالًّا فَهَدَىٰ",tr:"And He found you lost and guided you.",ref:"Surah Ad-Duha 93:7"}], mcq:[{q:"Al-Wajid means?",opts:["The All-Perceiving","The Forgiving","The Provider","The Patient"],ans:0}], moods:["lost","purposeless","questioning"] },
  { n:65, ar:"الْمَاجِدُ", tr:"Al-Majid", en:"The Noble — the One who is infinitely noble and most generous in His essence and all His attributes.", cat:"exalted", benefits:["Inspires deep awe at the nobility and grandeur of Allah.","Encourages seeking what is truly noble in our own character.","Deepens reverence and quality in every du'a made."], reflection:"Al-Majid's nobility means He gives freely, forgives freely, and loves freely. True nobility is never stingy — and neither is He.", quran:[{ar:"ذُو الْعَرْشِ الْمَجِيدُ",tr:"Owner of the Throne, the Most Glorious.",ref:"Surah Al-Buruj 85:15"}], mcq:[{q:"Al-Majid as a standalone means?",opts:["The Noble","The Creator","The Patient","The Judge"],ans:0}], moods:["spiritually low","distracted","disconnected"] },
  { n:66, ar:"الْوَاحِدُ", tr:"Al-Wahid", en:"The One — the One who is singular, unique, and has absolutely no partner, equal, or likeness.", cat:"exalted", benefits:["Strengthens the very foundation of tawhid (oneness of God).","Removes dependence on others for what only Allah can truly give.","Purifies worship completely from all forms of association."], reflection:"Al-Wahid — there is no committee running the universe, no partner in any decision, no second opinion needed. Just One. And that One is enough.", quran:[{ar:"وَإِلَٰهُكُمْ إِلَٰهٌ وَاحِدٌ",tr:"And your God is one God.",ref:"Surah Al-Baqarah 2:163"}], mcq:[{q:"Al-Wahid means?",opts:["The Provider","The One","The Forgiving","The Exalted"],ans:1}], moods:["spiritually disconnected","confused","questioning"] },
  { n:67, ar:"الأَحَدُ", tr:"Al-Ahad", en:"The Unique — the One who is uniquely singular and indivisible in a way that absolutely nothing else can be.", cat:"exalted", benefits:["Deepens profoundly the meaning and weight of Surah Al-Ikhlas.","Eliminates entirely any concept of multiplicity or partnership in divinity.","Purifies the heart through pure and complete monotheism."], reflection:"Al-Wahid means no partners. Al-Ahad goes far deeper — He cannot even theoretically be divided or compared. He is in a category entirely His own.", quran:[{ar:"قُلْ هُوَ اللَّهُ أَحَدٌ",tr:"Say: He is Allah, the Unique.",ref:"Surah Al-Ikhlas 112:1"}], mcq:[{q:"Al-Ahad is the first word of which surah?",opts:["Al-Fatiha","Al-Ikhlas","Al-Falaq","Al-Baqarah"],ans:1}], moods:["spiritually disconnected","questioning","purposeless"] },
  { n:68, ar:"الصَّمَدُ", tr:"As-Samad", en:"The Self-Sufficient — the One upon whom all of creation depends entirely while He depends on absolutely nothing.", cat:"exalted", benefits:["Encourages turning directly and only to Allah in every need.","Removes excessive and harmful dependence on other people.","Strengthens the heart completely in times of helplessness."], reflection:"As-Samad is the ultimate destination of all need. Every person you turn to for help is themselves turning to Him. Go directly to the Source.", quran:[{ar:"اللَّهُ الصَّمَدُ",tr:"Allah, the Self-Sufficient Master.",ref:"Surah Al-Ikhlas 112:2"}], mcq:[{q:"As-Samad means?",opts:["The Self-Sufficient","The Creator","The Judge","The Forgiving"],ans:0}], moods:["hopeless","anxious","dependent","lonely"] },
  { n:69, ar:"الْقَادِرُ", tr:"Al-Qadir", en:"The All-Capable — the One who has complete and absolute power and ability to do whatever He wills.", cat:"majesty", benefits:["Builds trust that absolutely nothing is impossible with Allah.","Encourages asking for what seems completely impossible.","Removes all self-imposed limitations we place on our du'a."], reflection:"Al-Qadir can create from nothing, restore what is gone, and change what seems entirely and permanently unchangeable.", quran:[{ar:"إِنَّ اللَّهَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ",tr:"Indeed, Allah is over all things competent.",ref:"Surah Al-Baqarah 2:20"}], mcq:[{q:"Al-Qadir means?",opts:["The All-Capable","The Forgiving","The Patient","The Wise"],ans:0}], moods:["hopeless","stuck","powerless","discouraged"] },
  { n:70, ar:"الْمُقْتَدِرُ", tr:"Al-Muqtadir", en:"The All-Determiner — the One whose power executes itself with absolute precision, authority, and perfect control.", cat:"majesty", benefits:["Deepens the understanding of divine control over all of existence.","Provides comfort that Allah's plans are never disrupted or delayed.","Encourages surrendering our fragile plans to His flawless authority."], reflection:"Al-Muqtadir doesn't just have power — He deploys it perfectly and precisely. Nothing in the universe happens outside His exact execution.", quran:[{ar:"عِندَ مَلِيكٍ مُّقْتَدِرٍ",tr:"In the presence of a Sovereign, All-Powerful.",ref:"Surah Al-Qamar 54:55"}], mcq:[{q:"Al-Muqtadir means?",opts:["The Forgiving","The All-Determiner","The Provider","The Exalted"],ans:1}], moods:["powerless","overwhelmed","anxious","confused"] },
  { n:71, ar:"الْمُقَدِّمُ", tr:"Al-Muqaddim", en:"The Expediter — the One who brings things forward and places them ahead of their time according to His wisdom.", cat:"wisdom", benefits:["Encourages deep trust in divine timing for all things.","Helps accept and appreciate why some blessings arrive unexpectedly early.","Removes frustration about circumstances seemingly arriving out of order."], reflection:"Al-Muqaddim moves things ahead of schedule when He wills. That blessing that came early — He deliberately sent it forward. Trust the timing.", quran:[{ar:"وَلَوْ يُعَجِّلُ اللَّهُ لِلنَّاسِ الشَّرَّ اسْتِعْجَالَهُم بِالْخَيْرِ",tr:"And if Allah were to hasten for people the ill as they wish to hasten the good, their term would have been concluded.",ref:"Surah Yunus 10:11"}], mcq:[{q:"Al-Muqaddim means?",opts:["The Delayer","The Expediter","The Provider","The Creator"],ans:1}], moods:["impatient","confused about timing","anxious"] },
  { n:72, ar:"الْمُؤَخِّرُ", tr:"Al-Mu'akhkhir", en:"The Delayer — the One who delays things and places them behind their expected time according to His perfect wisdom.", cat:"wisdom", benefits:["Builds essential patience during frustrating and painful delays.","Helps understand why some prayers are not answered immediately.","Encourages complete trust that a delay is never a denial."], reflection:"Al-Mu'akhkhir delays things not out of neglect but out of wisdom. The prayer not yet answered, the door not yet opened — He is timing it perfectly.", quran:[{ar:"لِكُلِّ أُمَّةٍ أَجَلٌ إِذَا جَاءَ أَجَلُهُمْ لَا يَسْتَأْخِرُونَ سَاعَةً وَلَا يَسْتَقْدِمُونَ",tr:"For every nation is a term. When their term comes, they can neither delay it nor advance it by an hour.",ref:"Surah Al-A'raf 7:34"}], mcq:[{q:"Al-Mu'akhkhir means?",opts:["The Expediter","The Delayer","The Provider","The Forgiving"],ans:1}], moods:["impatient","anxious","confused about timing","frustrated"] },
  { n:73, ar:"الأَوَّلُ", tr:"Al-Awwal", en:"The First — the One who exists before everything else, with absolutely nothing preceding His existence.", cat:"exalted", benefits:["Deepens understanding and certainty of Allah's eternality.","Removes doubt about the ultimate origin of all existence.","Grounds faith in the pre-eternal and self-existing God."], reflection:"Before light, before time, before the very concept of 'before' — Al-Awwal existed. He is the only true and absolute First.", quran:[{ar:"هُوَ الْأَوَّلُ وَالْآخِرُ وَالظَّاهِرُ وَالْبَاطِنُ",tr:"He is the First and the Last, the Manifest and the Hidden.",ref:"Surah Al-Hadid 57:3"}], mcq:[{q:"Al-Awwal means?",opts:["The Last","The First","The Manifest","The Hidden"],ans:1}], moods:["questioning","spiritually disconnected","doubting"] },
  { n:74, ar:"الآخِرُ", tr:"Al-Akhir", en:"The Last — the One who exists after everything ends, with absolutely no ending to His own existence.", cat:"exalted", benefits:["Provides comfort that something eternal and real remains after this world.","Encourages working for the akhirah over the temporary world.","Removes attachment to what is passing and transient."], reflection:"After the universe dissolves, after everything ends, Al-Akhir will remain. He is what every soul will ultimately and finally return to.", quran:[{ar:"هُوَ الْأَوَّلُ وَالْآخِرُ وَالظَّاهِرُ وَالْبَاطِنُ",tr:"He is the First and the Last, the Manifest and the Hidden.",ref:"Surah Al-Hadid 57:3"}], mcq:[{q:"Al-Akhir means?",opts:["The First","The Last","The Manifest","The Provider"],ans:1}], moods:["fearful of death","questioning","purposeless"] },
  { n:75, ar:"الظَّاهِرُ", tr:"Az-Zahir", en:"The Manifest — the One whose existence is evident and clear through His signs in every corner of creation.", cat:"exalted", benefits:["Encourages deep reflection on nature as clear proof of God.","Removes doubts by pointing to the unmistakable visible signs.","Builds gratitude for the countless visible blessings surrounding us."], reflection:"Az-Zahir is not hidden. The stars, the seasons, your own heartbeat — He announces Himself in everything, if only we would look.", quran:[{ar:"هُوَ الْأَوَّلُ وَالْآخِرُ وَالظَّاهِرُ وَالْبَاطِنُ",tr:"He is the First and the Last, the Manifest and the Hidden.",ref:"Surah Al-Hadid 57:3"}], mcq:[{q:"Az-Zahir means?",opts:["The Hidden","The Manifest","The Provider","The Forgiving"],ans:1}], moods:["questioning","doubting","spiritually disconnected"] },
  { n:76, ar:"الْبَاطِنُ", tr:"Al-Batin", en:"The Hidden — the One whose essence is beyond all perception, closer than anything yet impossible to fully comprehend.", cat:"exalted", benefits:["Builds profound awe about the mystery and depth of Allah.","Encourages spiritual reflection, contemplation, and inner stillness.","Reminds us our knowledge of Allah is always beautifully incomplete."], reflection:"Al-Batin is closer to you than your jugular vein yet beyond all perception. He is the deepest hidden reality beneath all visible reality.", quran:[{ar:"هُوَ الْأَوَّلُ وَالْآخِرُ وَالظَّاهِرُ وَالْبَاطِنُ",tr:"He is the First and the Last, the Manifest and the Hidden.",ref:"Surah Al-Hadid 57:3"}], mcq:[{q:"Al-Batin means?",opts:["The Manifest","The Hidden","The Provider","The Creator"],ans:1}], moods:["spiritual seeking","curious","questioning"] },
  { n:77, ar:"الْوَالِي", tr:"Al-Wali", en:"The Governor — the One who governs and controls all of creation with complete authority and perfect care.", cat:"guardian", benefits:["Builds deep trust in divine governance of all events in life.","Reduces anxiety and distress about world affairs and events.","Encourages willing submission to Allah's perfect governance."], reflection:"Al-Wali runs the universe without a committee, without a vote, without an election. His governance is the most just that has ever existed.", quran:[{ar:"وَاللَّهُ وَلِيُّ الْمُؤْمِنِينَ",tr:"And Allah is the ally of the believers.",ref:"Surah Aal-e-Imran 3:68"}], mcq:[{q:"Al-Wali means?",opts:["The Forgiving","The Governor","The Creator","The Wise"],ans:1}], moods:["anxious about world","uncertain","powerless"] },
  { n:78, ar:"الْمُتَعَالِي", tr:"Al-Muta'ali", en:"The Self-Exalted — the One who is exalted far beyond any description, comparison, limitation, or comprehension.", cat:"exalted", benefits:["Removes any limited or anthropomorphic human concept of Allah.","Inspires profound awe at the incomprehensible transcendence of Allah.","Encourages appropriate humility in all theological discussion."], reflection:"Al-Muta'ali means no matter how high your imagination takes you in conceiving Allah — He is still infinitely beyond that. Our minds cannot reach His true height.", quran:[{ar:"عَالِمُ الْغَيْبِ وَالشَّهَادَةِ الْكَبِيرُ الْمُتَعَالِ",tr:"Knower of the unseen and the witnessed, the Grand, the Exalted.",ref:"Surah Ar-Ra'd 13:9"}], mcq:[{q:"Al-Muta'ali means?",opts:["The Self-Exalted","The Forgiving","The Creator","The Provider"],ans:0}], moods:["questioning","spiritually disconnected","curious"] },
  { n:79, ar:"الْبَرُّ", tr:"Al-Barr", en:"The Source of Goodness — the One whose goodness and kindness toward creation is absolutely boundless and overflowing.", cat:"kindness", benefits:["Inspires deep gratitude for all blessings received without asking.","Encourages genuine good character as a reflection of divine kindness.","Provides hope that Allah's goodness toward us has no limit or end."], reflection:"Al-Barr's goodness doesn't wait for worthiness. Like rain falling on every land, His goodness reaches the grateful and ungrateful alike.", quran:[{ar:"إِنَّهُ هُوَ الْبَرُّ الرَّحِيمُ",tr:"Indeed, it is He who is the Source of Goodness, the Merciful.",ref:"Surah At-Tur 52:28"}], mcq:[{q:"Al-Barr means?",opts:["The Judge","The Source of Goodness","The Exalted","The Patient"],ans:1}], moods:["grateful","hopeful","spiritually low"] },
  { n:80, ar:"التَّوَّابُ", tr:"At-Tawwab", en:"The Ever-Relenting — the One who continuously and always accepts repentance and turns toward those who repent.", cat:"forgiver", benefits:["Gives lasting hope for continuous and repeated return to Allah.","Removes the devastating feeling of being permanently cut off from mercy.","Encourages making sincere tawbah frequently and without delay."], reflection:"At-Tawwab turns toward you every single time you turn toward Him. The door of repentance has no closing time — ever.", quran:[{ar:"وَتُوبُوا إِلَى اللَّهِ جَمِيعًا أَيُّهَ الْمُؤْمِنُونَ لَعَلَّكُمْ تُفْلِحُونَ",tr:"And turn to Allah in repentance, all of you, O believers, that you might succeed.",ref:"Surah An-Nur 24:31"}], mcq:[{q:"At-Tawwab means?",opts:["The Forgiving once","The Ever-Relenting","The Creator","The Wise"],ans:1}], moods:["guilty","seeking forgiveness","burdened","hopeless"] },
  { n:81, ar:"الْمُنْتَقِمُ", tr:"Al-Muntaqim", en:"The Avenger — the One who takes perfect vengeance from those who persist in evil and transgression.", cat:"majesty", benefits:["Provides deep comfort and relief to the oppressed.","Removes the crushing burden of seeking personal revenge.","Reminds all wrongdoers that justice will inevitably and surely come."], reflection:"Al-Muntaqim is a mercy to the oppressed — it means you don't have to carry the weight of vengeance. Justice belongs to a far more capable Hand.", quran:[{ar:"وَاللَّهُ عَزِيزٌ ذُو انتِقَامٍ",tr:"And Allah is Almighty, Owner of Vengeance.",ref:"Surah Aal-e-Imran 3:4"}], mcq:[{q:"Al-Muntaqim means?",opts:["The Forgiving","The Avenger","The Provider","The Wise"],ans:1}], moods:["oppressed","angry at injustice","grieving","powerless"] },
  { n:82, ar:"الْعَفُوُّ", tr:"Al-Afuww", en:"The Pardoner — the One who completely wipes away sins leaving absolutely no trace, as if they never existed.", cat:"forgiver", benefits:["Gives the most profound and complete relief from guilt.","Encourages the special du'a of Laylat al-Qadr.","Reminds us forgiveness means a completely and perfectly clean slate."], reflection:"Al-Ghafur covers sins. Al-Afuww goes far further — He erases them completely. Not buried, not on record — utterly and completely gone.", quran:[{ar:"إِنَّ اللَّهَ كَانَ عَفُوًّا غَفُورًا",tr:"Indeed, Allah is ever Pardoning and Forgiving.",ref:"Surah An-Nisa 4:99"}], mcq:[{q:"What is special about Al-Afuww's forgiveness?",opts:["It covers sins","It erases sins completely as if they never happened","It delays punishment","It forgives only major sins"],ans:1}], moods:["guilty","seeking forgiveness","hopeless","burdened"] },
  { n:83, ar:"الرَّؤُوفُ", tr:"Ar-Ra'uf", en:"The Most Kind — the One who shows the most tender and compassionate kindness, especially to the vulnerable and weak.", cat:"mercy", benefits:["Provides deep comfort to the weak, vulnerable, and suffering.","Encourages extraordinary gentleness toward others, especially the weak.","Reminds us Allah's kindness is especially tender toward those who struggle."], reflection:"If Ar-Rahman is boundless mercy, Ar-Ra'uf is mercy with tenderness — the kind that holds you gently when you're at your most fragile and broken.", quran:[{ar:"إِنَّ اللَّهَ بِالنَّاسِ لَرَءُوفٌ رَّحِيمٌ",tr:"Indeed Allah is Most Kind and Merciful to the people.",ref:"Surah Al-Baqarah 2:143"}], mcq:[{q:"Ar-Ra'uf means?",opts:["The All-Knowing","The Most Kind","The Exalted","The Creator"],ans:1}], moods:["vulnerable","sad","lonely","anxious"] },
  { n:84, ar:"مَالِكُ الْمُلْكِ", tr:"Malik al-Mulk", en:"The Owner of All Sovereignty — the One who owns all dominion absolutely and gives it to whom He wills.", cat:"majesty", benefits:["Removes dependence on rulers, governments, and worldly power.","Encourages seeking rank and elevation through Allah alone.","Builds essential perspective on the ephemeral nature of worldly power."], reflection:"Malik al-Mulk gave kingdoms to Sulaiman and took them from Pharaoh. All power is merely on loan from Him.", quran:[{ar:"قُلِ اللَّهُمَّ مَالِكَ الْمُلْكِ تُؤْتِي الْمُلْكَ مَن تَشَاءُ وَتَنزِعُ الْمُلْكَ مِمَّن تَشَاءُ",tr:"Say: O Allah, Owner of Sovereignty, You give sovereignty to whom You will and take it from whom You will.",ref:"Surah Aal-e-Imran 3:26"}], mcq:[{q:"Malik al-Mulk means?",opts:["The Forgiving","The Owner of All Sovereignty","The Provider","The Wise"],ans:1}], moods:["powerless","overwhelmed","oppressed","humiliated"] },
  { n:85, ar:"ذُو الْجَلَالِ وَالْإِكْرَامِ", tr:"Dhul-Jalal wal-Ikram", en:"The Lord of Majesty and Bounty — the One who combines supreme majesty with supreme and overflowing generosity.", cat:"exalted", benefits:["Inspires the most complete awe and reverence in all worship.","Encourages calling on Allah with both deep reverence and bold hope.","Deepens greatly the quality and richness of every du'a made."], reflection:"Dhul-Jalal wal-Ikram combines awe and love perfectly. He is so great it overwhelms you — and so generous it draws you irresistibly back.", quran:[{ar:"تَبَارَكَ اسْمُ رَبِّكَ ذِي الْجَلَالِ وَالْإِكْرَامِ",tr:"Blessed is the name of your Lord, Owner of Majesty and Honour.",ref:"Surah Ar-Rahman 55:78"}], mcq:[{q:"Dhul-Jalal wal-Ikram means?",opts:["The Forgiving","Lord of Majesty and Bounty","The Provider","The Creator"],ans:1}], moods:["spiritual seeking","distracted","spiritually low"] },
  { n:86, ar:"الْمُقْسِطُ", tr:"Al-Muqsit", en:"The Equitable — the One who acts with complete and perfect equity and fairness in absolutely all situations.", cat:"wisdom", benefits:["Builds deep trust in divine fairness that surpasses human justice.","Encourages being just and equitable in our own daily dealings.","Provides comfort and peace when human fairness completely fails."], reflection:"Al-Muqsit's fairness is not swayed by money, influence, or emotion. Every soul will receive exactly what it is perfectly due.", quran:[{ar:"وَنَضَعُ الْمَوَازِينَ الْقِسْطَ لِيَوْمِ الْقِيَامَةِ",tr:"And We place the scales of justice for the Day of Resurrection.",ref:"Surah Al-Anbiya 21:47"}], mcq:[{q:"Al-Muqsit means?",opts:["The Equitable","The Forgiving","The Creator","The Provider"],ans:0}], moods:["troubled","angry at injustice","confused about fate"] },
  { n:87, ar:"الْجَامِعُ", tr:"Al-Jami", en:"The Gatherer — the One who gathers all of creation together for the Day of Judgement.", cat:"majesty", benefits:["Strengthens belief in the great gathering on Judgement Day.","Encourages serious preparation for that inevitable day.","Provides beautiful hope for reunion with righteous loved ones."], reflection:"Al-Jami will gather every soul that ever lived in one place. Every lost one, every forgotten one — none will be missing from His gathering.", quran:[{ar:"رَبَّنَا إِنَّكَ جَامِعُ النَّاسِ لِيَوْمٍ لَّا رَيْبَ فِيهِ",tr:"Our Lord, indeed You will gather the people for a Day about which there is no doubt.",ref:"Surah Aal-e-Imran 3:9"}], mcq:[{q:"Al-Jami means?",opts:["The Forgiver","The Gatherer","The Provider","The Wise"],ans:1}], moods:["grieving","hopeless","questioning","fearful of death"] },
  { n:88, ar:"الْغَنِيُّ", tr:"Al-Ghani", en:"The Self-Sufficient — the One who is completely free of all need while all of creation depends entirely on Him.", cat:"exalted", benefits:["Removes the illusion that our worship somehow benefits Allah.","Encourages sincere worship rather than transactional or self-serving worship.","Builds deep gratitude for being permitted and invited to worship."], reflection:"Al-Ghani doesn't need your prayer — you need it. Your worship doesn't add to Him; it only adds to you.", quran:[{ar:"إِنَّ اللَّهَ لَغَنِيٌّ عَنِ الْعَالَمِينَ",tr:"Indeed, Allah is free of need from the worlds.",ref:"Surah Aal-e-Imran 3:97"}], mcq:[{q:"Al-Ghani means?",opts:["The Generous","The Self-Sufficient","The Patient","The Creator"],ans:1}], moods:["spiritually disconnected","distracted","questioning"] },
  { n:89, ar:"الْمُغْنِي", tr:"Al-Mughni", en:"The Enricher — the One who enriches and provides abundantly for whomever He wills in all forms.", cat:"creator", benefits:["Encourages turning directly to Allah in times of financial hardship.","Reminds us that all true wealth and richness comes from Allah alone.","Removes complete despair about poverty in any of its forms."], reflection:"Al-Mughni enriches with far more than money — He enriches hearts, relationships, and souls. The richest person may have the least bank balance.", quran:[{ar:"وَأَنَّهُ هُوَ أَغْنَىٰ وَأَقْنَىٰ",tr:"And that it is He who enriches and suffices.",ref:"Surah An-Najm 53:48"}], mcq:[{q:"Al-Mughni means?",opts:["The Forgiver","The Enricher","The Judge","The Holy"],ans:1}], moods:["financial stress","hopeless","worried","anxious"] },

// STATE

let state = JSON.parse(localStorage.getItem('asma_state_v2') || '{}');
state.learned   = state.learned   || {};
state.revisits  = state.revisits  || {};
state.streak    = state.streak    || 0;
state.bestStreak= state.bestStreak|| 0;
state.lastVisit = state.lastVisit || null;
state.weekActivity = state.weekActivity || {};
state.customPlaylist = state.customPlaylist || [];
state.todayName = state.todayName || null;
state.todayDate = state.todayDate || null;
state.learnedDates = state.learnedDates || {};
state.dailyLearned = state.dailyLearned || {};
state.currentMode = state.currentMode || 'balanced';

const TODAY = new Date().toISOString().slice(0,10);
function save() { localStorage.setItem('asma_state_v2', JSON.stringify(state)); }

function checkStreak() {
  if (state.lastVisit === TODAY) return;
  const yesterday = new Date(); yesterday.setDate(yesterday.getDate()-1);
  const yStr = yesterday.toISOString().slice(0,10);
  if (state.lastVisit === yStr) { state.streak++; }
  else { state.streak = 1; }
  if (state.streak > state.bestStreak) state.bestStreak = state.streak;
  state.lastVisit = TODAY;
  state.weekActivity[TODAY] = true;
  save();
}

function getNotd() {
  if (state.todayDate === TODAY && state.todayName) {
    const found = NAMES.find(n=>n.n===state.todayName);
    if (found) return found;
  }
  const dayNum = Math.floor((new Date(TODAY) - new Date('2024-01-01')) / 86400000);
  const sorted = [...NAMES].sort((a,b)=>a.n-b.n);
  const pick = sorted[dayNum % sorted.length];
  state.todayName = pick.n; state.todayDate = TODAY; save();
  return pick;
}

function getStatus(n) {
  if ((state.revisits[n]||0) >= 3) return 'mastered';
  if (state.learned[n]) return 'learned';
  return 'new';
}

function updateUI() {
  const learned  = Object.keys(state.learned).length;
  const mastered = Object.values(state.revisits).filter(v=>v>=3).length;
  document.getElementById('learnedCount').textContent  = learned;
  document.getElementById('masteredCount').textContent = mastered;
  document.getElementById('remainCount').textContent   = 99 - learned;
  document.getElementById('mainProgBar').style.width   = (learned/99*100)+'%';
  document.getElementById('streakCount').textContent   = state.streak;
  document.getElementById('bestStreak').textContent    = state.bestStreak;
}

let currentPage = 'home', currentDetail = null, currentMood = null;

function showPage(page) {
  currentPage = page;
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.remove('active'));
  const nav = document.getElementById('nav-'+page);
  if (nav) nav.classList.add('active');
  const titles = {home:'Home',names:'All 99 Names',playlist:'Playlists',stats:'My Journey'};
  document.getElementById('topbarTitle').textContent = titles[page] || page;
  const content = document.getElementById('pageContent');
  if (page==='home') renderHome(content);
  else if (page==='names') renderNames(content);
  else if (page==='playlist') renderPlaylist(content);
  else if (page==='stats') renderStats(content);
  closeSidebar();
}
