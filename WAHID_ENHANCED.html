<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WAHID — 99 Names of Allah</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Nunito:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #08090f;
  --surface: #0f1119;
  --surface2: #161824;
  --surface3: #1c1f2e;
  --border: rgba(255,255,255,0.06);
  --border2: rgba(255,255,255,0.1);
  --gold: #c9a84c;
  --gold2: #e2c06a;
  --gold-dim: rgba(201,168,76,0.12);
  --gold-border: rgba(201,168,76,0.25);
  --teal: #2d9c96;
  --teal2: #3db8b1;
  --teal-dim: rgba(45,156,150,0.1);
  --teal-border: rgba(45,156,150,0.25);
  --text: #dde1ec;
  --text2: #8b95ad;
  --text3: #525c72;
  --learned: #2d9c96;
  --mastered: #c9a84c;
  --streak: #c2703a;
  --red: #c0392b;
  --green: #27ae60;
  --radius: 14px;
  --radius-sm: 9px;
  --shadow: 0 12px 40px rgba(0,0,0,0.5);
}
.light {
  --bg: #f2efe8;
  --surface: #faf8f3;
  --surface2: #ede9e0;
  --surface3: #e3ddd2;
  --border: rgba(0,0,0,0.07);
  --border2: rgba(0,0,0,0.12);
  --text: #1a1c26;
  --text2: #4a5068;
  --text3: #8a91a8;
  --gold-dim: rgba(201,168,76,0.07);
  --teal-dim: rgba(45,156,150,0.07);
  --shadow: 0 8px 32px rgba(0,0,0,0.08);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:background 0.3s,color 0.3s;overflow-x:hidden}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--gold);border-radius:3px;opacity:0.5}
svg{display:block;flex-shrink:0}

/* ── LAYOUT ── */
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:252px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;transition:transform 0.3s}
.main{flex:1;overflow-y:auto;position:relative}

/* ── SIDEBAR ── */
.sidebar-logo{padding:28px 20px 20px;border-bottom:1px solid var(--border);text-align:center}
.logo-mark{width:36px;height:2px;background:var(--gold);margin:0 auto 14px;border-radius:2px}
.logo-arabic{font-family:'Amiri',serif;font-size:26px;color:var(--gold);line-height:1.3;margin-bottom:6px}
.logo-en{font-size:10px;color:var(--text3);letter-spacing:3px;text-transform:uppercase}

.streak-bar{margin:16px;background:var(--surface2);border-radius:var(--radius-sm);padding:14px;border:1px solid var(--border)}
.streak-inner{display:flex;align-items:center;gap:12px}
.streak-icon{width:36px;height:36px;background:var(--gold-dim);border:1px solid var(--gold-border);border-radius:8px;display:flex;align-items:center;justify-content:center}
.streak-info{flex:1}
.streak-count{font-size:20px;font-weight:800;color:var(--streak);font-family:'Playfair Display',serif;letter-spacing:-0.5px}
.streak-label{font-size:10px;color:var(--text3);letter-spacing:1.5px;text-transform:uppercase;margin-top:1px}
.streak-best{text-align:right}
.streak-best-num{font-size:14px;font-weight:800;color:var(--gold2);font-family:'Playfair Display',serif}
.streak-best-lbl{font-size:9px;color:var(--text3);letter-spacing:1px;text-transform:uppercase}

.progress-summary{margin:0 16px 8px;background:var(--surface2);border-radius:var(--radius-sm);padding:14px;border:1px solid var(--border)}
.progress-row{display:flex;justify-content:space-between;margin-bottom:10px}
.prog-stat{text-align:center}
.prog-num{font-size:17px;font-weight:800;color:var(--gold);font-family:'Playfair Display',serif}
.prog-lbl{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:1.5px;margin-top:1px}
.prog-bar-wrap{background:var(--surface3);border-radius:3px;height:3px;overflow:hidden}
.prog-bar-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--teal),var(--gold));transition:width 0.7s cubic-bezier(0.4,0,0.2,1)}

.nav-section{padding:18px 16px 6px;font-size:9px;color:var(--text3);letter-spacing:2.5px;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 14px;cursor:pointer;border-radius:var(--radius-sm);margin:1px 8px;transition:all 0.18s;font-size:13px;font-weight:600;color:var(--text2)}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item.active{background:var(--gold-dim);color:var(--gold);border:1px solid var(--gold-border)}
.nav-icon{width:20px;display:flex;align-items:center;justify-content:center}

.cat-section{padding:16px 16px 6px;font-size:9px;color:var(--text3);letter-spacing:2.5px;text-transform:uppercase}
.cat-chip{display:flex;align-items:center;gap:8px;padding:8px 14px;cursor:pointer;border-radius:var(--radius-sm);margin:1px 8px;transition:all 0.18s;font-size:12px;font-weight:500;color:var(--text2)}
.cat-chip:hover{background:var(--surface2);color:var(--text)}
.cat-chip.active{background:var(--teal-dim);color:var(--teal)}
.cat-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.cat-count{margin-left:auto;font-size:10px;color:var(--text3);background:var(--surface3);border-radius:20px;padding:2px 7px}

.sidebar-footer{margin-top:auto;padding:14px 16px;border-top:1px solid var(--border);display:flex;gap:8px}
.theme-btn{flex:1;padding:8px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;color:var(--text2);font-size:12px;font-weight:600;font-family:inherit;transition:all 0.18s;letter-spacing:0.5px}
.theme-btn:hover{background:var(--surface3);color:var(--text)}

/* ── TOPBAR ── */
.topbar{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;gap:14px;backdrop-filter:blur(16px)}
.topbar-title{font-size:18px;font-weight:800;flex:1;letter-spacing:-0.3px}
.search-wrap{position:relative;flex:1;max-width:340px}
.search-input{width:100%;padding:9px 16px 9px 38px;background:var(--surface);border:1px solid var(--border);border-radius:40px;color:var(--text);font-size:13px;font-family:inherit;outline:none;transition:border 0.2s}
.search-input:focus{border-color:var(--gold)}
.search-input::placeholder{color:var(--text3)}
.search-icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--text3)}
.icon-btn{width:38px;height:38px;border-radius:50%;background:var(--surface);border:1px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.18s;color:var(--text2)}
.icon-btn:hover{background:var(--surface2);border-color:var(--gold-border);color:var(--gold)}
.menu-btn{display:none}

/* ── CONTENT ── */
.content{padding:24px}

/* ── NAME OF THE DAY ── */
.notd{background:linear-gradient(145deg,var(--surface) 0%,var(--surface2) 100%);border:1px solid var(--border2);border-radius:18px;padding:32px;margin-bottom:24px;position:relative;overflow:hidden}
.notd::before{content:'';position:absolute;top:-60px;right:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,var(--gold-dim) 0%,transparent 70%);pointer-events:none}
.notd::after{content:'';position:absolute;bottom:-40px;left:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,var(--teal-dim) 0%,transparent 70%);pointer-events:none}
.notd-badge{display:inline-flex;align-items:center;gap:6px;background:var(--gold-dim);border:1px solid var(--gold-border);border-radius:4px;padding:4px 12px;font-size:10px;font-weight:700;color:var(--gold);letter-spacing:2px;text-transform:uppercase;margin-bottom:20px}
.notd-badge-line{width:16px;height:1px;background:var(--gold)}
.notd-arabic{font-family:'Amiri',serif;font-size:52px;color:var(--gold);text-align:center;margin:8px 0 6px;line-height:1.3;direction:rtl}
.notd-transliteration{text-align:center;font-size:22px;font-weight:700;color:var(--text);margin-bottom:5px;font-family:'Playfair Display',serif;letter-spacing:-0.3px}
.notd-meaning{text-align:center;font-size:14px;color:var(--text2);margin-bottom:20px;font-style:italic;max-width:420px;margin-left:auto;margin-right:auto;line-height:1.6}
.notd-number{font-family:'Playfair Display',serif;font-size:88px;font-weight:600;color:rgba(255,255,255,0.03);position:absolute;right:24px;bottom:-12px;line-height:1;user-select:none}
.notd-actions{display:flex;gap:10px;flex-wrap:wrap;position:relative;z-index:1}

/* ── BUTTONS ── */
.btn{padding:9px 20px;border-radius:6px;border:none;cursor:pointer;font-size:12px;font-weight:700;font-family:inherit;transition:all 0.18s;display:inline-flex;align-items:center;gap:7px;letter-spacing:0.8px;text-transform:uppercase}
.btn-gold{background:var(--gold);color:#08090f}
.btn-gold:hover{background:var(--gold2);transform:translateY(-1px)}
.btn-outline{background:transparent;border:1px solid var(--border2);color:var(--text2)}
.btn-outline:hover{border-color:var(--gold-border);color:var(--gold)}
.btn-teal{background:var(--teal-dim);border:1px solid var(--teal-border);color:var(--teal)}
.btn-teal:hover{background:rgba(45,156,150,0.18)}
.btn-unlearn{background:transparent;border:1px solid var(--gold-border);color:var(--gold);font-size:11px}
.btn-unlearn:hover{background:var(--gold-dim);color:var(--gold2)}

/* ── SECTION TITLE ── */
.section-title{font-size:11px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:12px;color:var(--text3);letter-spacing:2.5px;text-transform:uppercase}
.section-title::after{content:'';flex:1;height:1px;background:var(--border)}

/* ── CATEGORY GRID ── */
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px;margin-bottom:28px}
.cat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 16px;cursor:pointer;transition:all 0.22s;position:relative;overflow:hidden}
.cat-card:hover{transform:translateY(-2px);border-color:var(--border2);box-shadow:0 8px 28px rgba(0,0,0,0.3)}
.cat-card-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;margin-bottom:12px;flex-shrink:0}
.cat-card-name{font-size:13px;font-weight:700;margin-bottom:3px;color:var(--text)}
.cat-card-count{font-size:11px;color:var(--text3)}
.cat-card-prog{margin-top:12px;background:var(--surface3);border-radius:2px;height:2px;overflow:hidden}
.cat-card-fill{height:100%;border-radius:2px;transition:width 0.5s}

/* ── NAMES GRID ── */
.names-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.name-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;cursor:pointer;transition:all 0.22s;position:relative;overflow:hidden}
.name-card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--border2)}
.name-card-num{font-size:10px;color:var(--text3);font-weight:700;letter-spacing:2px;margin-bottom:10px;text-transform:uppercase}
.name-card-arabic{font-family:'Amiri',serif;font-size:28px;color:var(--gold);direction:rtl;line-height:1.4;margin-bottom:8px}
.name-card-trans{font-size:15px;font-weight:700;margin-bottom:4px;font-family:'Playfair Display',serif;letter-spacing:-0.2px}
.name-card-meaning{font-size:12px;color:var(--text2);line-height:1.55}
.name-card-badges{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap;align-items:center}
.badge{padding:3px 9px;border-radius:4px;font-size:9px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase}
.badge-new{background:var(--surface2);color:var(--text3);border:1px solid var(--border)}
.badge-learned{background:var(--teal-dim);color:var(--teal);border:1px solid var(--teal-border)}
.badge-mastered{background:var(--gold-dim);color:var(--gold);border:1px solid var(--gold-border)}
.cat-tag{padding:3px 9px;border-radius:4px;font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase}

/* ── DETAIL PANEL ── */
.detail-panel{position:fixed;right:0;top:0;height:100vh;width:440px;background:var(--surface);border-left:1px solid var(--border);z-index:100;overflow-y:auto;transform:translateX(100%);transition:transform 0.32s cubic-bezier(0.4,0,0.2,1);box-shadow:-12px 0 50px rgba(0,0,0,0.4)}
.detail-panel.open{transform:translateX(0)}
.detail-header{padding:24px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);z-index:5}
.detail-close{width:34px;height:34px;border-radius:6px;background:var(--surface2);border:1px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;margin-bottom:18px;color:var(--text2);transition:all 0.18s}
.detail-close:hover{border-color:var(--border2);color:var(--text)}
.detail-num{font-size:10px;color:var(--text3);letter-spacing:2.5px;text-transform:uppercase;margin-bottom:6px}
.detail-arabic{font-family:'Amiri',serif;font-size:48px;color:var(--gold);direction:rtl;line-height:1.3;margin-bottom:10px}
.detail-trans{font-size:24px;font-weight:700;margin-bottom:5px;font-family:'Playfair Display',serif;letter-spacing:-0.3px}
.detail-meaning{font-size:14px;color:var(--text2);font-style:italic;margin-bottom:16px;line-height:1.6}
.detail-badges{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.detail-actions{display:flex;gap:8px;flex-wrap:wrap}

.detail-body{padding:24px}
.detail-section{margin-bottom:26px}
.detail-section-title{font-size:9px;color:var(--text3);letter-spacing:2.5px;text-transform:uppercase;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.detail-section-title::after{content:'';flex:1;height:1px;background:var(--border)}

.benefit-item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.benefit-item:last-child{border-bottom:none}
.benefit-bullet{width:4px;height:4px;background:var(--gold);border-radius:50%;margin-top:7px;flex-shrink:0}
.benefit-text{font-size:13px;color:var(--text2);line-height:1.65}

.reflection-box{background:var(--surface2);border-left:2px solid var(--gold);border-radius:0 8px 8px 0;padding:16px 18px;font-size:13px;color:var(--text2);line-height:1.75;font-style:italic}

.quran-ref{background:var(--surface2);border-radius:var(--radius-sm);padding:16px;margin-bottom:10px;border:1px solid var(--border)}
.quran-arabic{font-family:'Amiri',serif;font-size:19px;color:var(--gold);direction:rtl;line-height:1.9;margin-bottom:10px;text-align:right}
.quran-trans{font-size:13px;color:var(--text2);line-height:1.65;margin-bottom:8px;font-style:italic}
.quran-ref-tag{font-size:10px;color:var(--teal);font-weight:700;letter-spacing:1px;text-transform:uppercase}

/* ── MCQ ── */
.mcq-wrap{background:var(--surface2);border-radius:var(--radius);padding:18px;border:1px solid var(--border)}
.mcq-q{font-size:13px;font-weight:700;margin-bottom:14px;line-height:1.55;color:var(--text)}
.mcq-options{display:flex;flex-direction:column;gap:8px}
.mcq-opt{padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;font-size:12px;transition:all 0.18s;text-align:left;color:var(--text2);font-family:inherit;font-weight:600}
.mcq-opt:hover{border-color:var(--teal-border);color:var(--teal)}
.mcq-opt.correct{background:rgba(39,174,96,0.08);border-color:var(--green);color:var(--green)}
.mcq-opt.wrong{background:rgba(192,57,43,0.08);border-color:var(--red);color:var(--red)}
.mcq-feedback{margin-top:12px;padding:10px 14px;border-radius:var(--radius-sm);font-size:12px;font-weight:700;display:none;letter-spacing:0.3px}
.mcq-feedback.show{display:block}
.mcq-feedback.correct{background:rgba(39,174,96,0.08);color:var(--green);border:1px solid rgba(39,174,96,0.2)}
.mcq-feedback.wrong{background:rgba(192,57,43,0.08);color:var(--red);border:1px solid rgba(192,57,43,0.2)}
.mcq-next{margin-top:12px;display:none}
.mcq-next.show{display:block}

/* ── MATCH ── */
.match-guide{font-size:12px;color:var(--text3);margin-bottom:12px;padding:10px;background:var(--surface2);border-radius:var(--radius-sm);border-left:3px solid var(--teal)}
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.match-column{display:flex;flex-direction:column;gap:8px}
.match-column-title{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:4px}
.match-item{padding:11px 13px;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;font-size:12px;transition:all 0.2s;text-align:center;color:var(--text2);font-weight:600;min-height:44px;display:flex;align-items:center;justify-content:center;line-height:1.4}
.match-item:hover{border-color:var(--teal-border);background:var(--surface2)}
.match-item.selected{border-color:var(--gold);background:var(--gold-dim);color:var(--gold);font-weight:700;box-shadow:0 0 8px rgba(201,168,76,0.15)}
.match-item.matched{border-color:var(--green);background:rgba(39,174,96,0.12);color:var(--green);pointer-events:none;font-weight:700;box-shadow:0 0 8px rgba(39,174,96,0.2)}
.match-item.wrong-flash{animation:shake 0.4s;border-color:var(--red);background:rgba(192,57,43,0.1)}
@keyframes shake{0%,100%{transform:translateX(0)};25%{transform:translateX(-4px)};75%{transform:translateX(4px)}}

/* ── PLAYLIST ── */
.playlist-panel{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:24px;margin-bottom:24px}
.mood-chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.mood-chip{padding:7px 16px;border-radius:4px;border:1px solid var(--border);background:var(--surface2);color:var(--text2);cursor:pointer;font-size:12px;font-weight:700;transition:all 0.18s;font-family:inherit;letter-spacing:0.5px;text-transform:uppercase}
.mood-chip:hover{border-color:var(--teal-border);color:var(--teal)}
.mood-chip.active{background:var(--teal-dim);border-color:var(--teal-border);color:var(--teal)}
.playlist-items{display:flex;flex-direction:column;gap:6px;margin-top:16px}
.pl-item{display:flex;align-items:center;gap:14px;padding:12px 16px;background:var(--surface2);border-radius:var(--radius-sm);cursor:pointer;transition:all 0.18s;border:1px solid transparent}
.pl-item:hover{border-color:var(--border);background:var(--surface3)}
.pl-item.playing{border-color:var(--teal-border);background:var(--teal-dim)}
.pl-num{font-size:11px;color:var(--text3);width:24px;text-align:center;font-weight:700;font-family:'Playfair Display',serif}
.pl-arabic{font-family:'Amiri',serif;font-size:20px;color:var(--gold);direction:rtl;width:48px;text-align:right}
.pl-info{flex:1}
.pl-trans{font-size:13px;font-weight:700;font-family:'Playfair Display',serif;letter-spacing:-0.1px}
.pl-meaning{font-size:11px;color:var(--text2);margin-top:2px}
.pl-cat{font-size:9px;color:var(--teal);font-weight:700;padding:3px 9px;background:var(--teal-dim);border-radius:4px;letter-spacing:1px;text-transform:uppercase;border:1px solid var(--teal-border)}

/* ── TOAST ── */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--surface);border:1px solid var(--border2);border-radius:6px;padding:12px 20px;font-size:12px;font-weight:700;z-index:999;transition:transform 0.35s cubic-bezier(0.34,1.56,0.64,1);box-shadow:var(--shadow);display:flex;align-items:center;gap:8px;white-space:nowrap;letter-spacing:0.5px;text-transform:uppercase}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.gold{border-color:var(--gold-border);color:var(--gold)}
.toast.teal{border-color:var(--teal-border);color:var(--teal)}
.toast.streak{border-color:rgba(194,112,58,0.4);color:var(--streak)}

/* ── REMINDER ── */
.reminder-banner{background:var(--surface2);border:1px solid rgba(194,112,58,0.25);border-left:3px solid var(--streak);border-radius:var(--radius-sm);padding:16px 18px;margin-bottom:20px;display:flex;align-items:center;gap:14px}
.reminder-icon-wrap{width:36px;height:36px;background:rgba(194,112,58,0.1);border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.reminder-text{flex:1}
.reminder-title{font-weight:800;color:var(--streak);margin-bottom:3px;font-size:13px;letter-spacing:0.3px}
.reminder-sub{font-size:12px;color:var(--text2)}
.dismiss-btn{background:none;border:none;color:var(--text3);cursor:pointer;padding:4px;transition:color 0.18s;display:flex;align-items:center;justify-content:center}
.dismiss-btn:hover{color:var(--text)}

/* ── STUDY MODES ── */
.study-modes{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.mode-btn{padding:10px 18px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;color:var(--text2);font-size:12px;font-weight:700;font-family:inherit;transition:all 0.18s;letter-spacing:0.5px;text-transform:uppercase}
.mode-btn:hover{background:var(--surface3);border-color:var(--teal-border);color:var(--teal)}
.mode-btn.active{background:var(--teal-dim);border-color:var(--teal-border);color:var(--teal);font-weight:800}

/* ── INSIGHTS & STATS ── */
.insight-card{background:linear-gradient(135deg,var(--surface2) 0%,var(--surface3) 100%);border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px;margin-bottom:12px}
.insight-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:2px;margin-bottom:6px;font-weight:700}
.insight-value{font-size:18px;color:var(--gold);font-weight:800;font-family:'Playfair Display',serif;margin-bottom:4px}
.insight-meta{font-size:11px;color:var(--text2)}

.milestone-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:12px}
.milestone{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px;text-align:center;transition:all 0.2s}
.milestone.unlocked{border-color:var(--gold-border);background:var(--gold-dim)}
.milestone.locked{opacity:0.5}
.milestone-icon{font-size:24px;margin-bottom:6px;height:28px;display:flex;align-items:center;justify-content:center}
.milestone-text{font-size:11px;font-weight:700;color:var(--text2)}
.milestone.unlocked .milestone-text{color:var(--gold)}

/* ── SPACED REPETITION ── */
.repet-box{background:var(--surface2);border-left:3px solid var(--teal);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:10px;font-size:12px;color:var(--text2)}
.repet-label{font-weight:700;color:var(--teal);margin-bottom:4px}

/* ── PROGRESS RINGS ── */
.progress-ring-wrap{display:flex;align-items:center;gap:16px;background:var(--surface2);border-radius:var(--radius-sm);padding:16px;margin-bottom:14px}
.progress-ring-visual{position:relative;width:80px;height:80px;flex-shrink:0}
.progress-ring-bg{width:100%;height:100%;border-radius:50%;border:3px solid var(--surface3)}
.progress-ring-fill{position:absolute;top:0;left:0;width:100%;height:100%;border-radius:50%;border:3px solid transparent;border-top-color:var(--teal);border-right-color:var(--gold);transform:rotate(-90deg);transition:all 0.8s}
.progress-ring-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
.progress-ring-num{font-size:18px;font-weight:800;color:var(--gold);font-family:'Playfair Display',serif}
.progress-ring-lbl{font-size:9px;color:var(--text3);text-transform:uppercase}
.progress-info{flex:1}
.progress-info-row{display:flex;justify-content:space-between;margin-bottom:8px;font-size:12px}
.progress-info-label{color:var(--text2)}
.progress-info-value{font-weight:700;color:var(--text)}

/* ── LEARNING JOURNEY ── */
.journey-timeline{margin-top:12px}
.journey-marker{display:flex;gap:12px;margin-bottom:14px;position:relative;padding-left:24px}
.journey-marker::before{content:'';position:absolute;left:8px;top:8px;width:8px;height:8px;background:var(--teal);border-radius:50%}
.journey-marker.current::before{background:var(--gold);width:12px;height:12px;top:5px;left:6px;box-shadow:0 0 12px rgba(201,168,76,0.4)}
.journey-marker.future::before{background:var(--text3);opacity:0.3}
.journey-date{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:2px}
.journey-action{font-size:12px;color:var(--text);font-weight:600}

/* ── ENCOURAGEMENT ── */
.encouragement-box{background:linear-gradient(135deg,var(--teal-dim) 0%,rgba(45,156,150,0.05) 100%);border:1px solid var(--teal-border);border-radius:var(--radius-sm);padding:14px;margin-bottom:14px;font-size:12px;color:var(--text);line-height:1.6;font-weight:600;letter-spacing:0.3px}

/* ── STATS ── */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-bottom:24px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;text-align:center}
.stat-icon-wrap{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;margin:0 auto 10px}
.stat-num{font-size:28px;font-weight:800;font-family:'Playfair Display',serif;letter-spacing:-1px}
.stat-lbl{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:2px;margin-top:3px}
.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:24px}
.day-dot{aspect-ratio:1;border-radius:var(--radius-sm);background:var(--surface);border:1px solid var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.day-dot.done{background:var(--gold-dim);border-color:var(--gold-border)}
.day-dot.today{border-color:var(--teal-border);background:var(--teal-dim)}
.day-name{font-size:8px;text-transform:uppercase;letter-spacing:1px;color:var(--text3)}
.day-check{font-size:11px;font-weight:800}
.day-dot.done .day-name,.day-dot.done .day-check{color:var(--gold)}
.day-dot.today .day-name,.day-dot.today .day-check{color:var(--teal)}

/* ── PROGRESS IN STATS ── */
.cat-progress-row{margin-bottom:16px}
.cat-progress-label{display:flex;justify-content:space-between;margin-bottom:6px;align-items:center}
.cat-progress-name{font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px}
.cat-progress-frac{font-size:11px;color:var(--text3)}

/* ── EMPTY ── */
.empty{text-align:center;padding:56px 24px;color:var(--text3)}
.empty-icon{width:48px;height:48px;margin:0 auto 16px;opacity:0.4}
.empty-text{font-size:14px;letter-spacing:0.3px}

/* ── OVERLAY ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:150;display:none;backdrop-filter:blur(2px)}
.overlay.show{display:block}

/* ── LEARN PROGRESS BOX ── */
.learn-progress-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.learn-stage{padding:14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);text-align:center}
.learn-stage-icon{font-size:20px;margin-bottom:6px}
.learn-stage-title{font-size:11px;font-weight:700;margin-bottom:3px;letter-spacing:0.5px}
.learn-stage-desc{font-size:10px;color:var(--text3)}

/* ── MOBILE ── */
@media(max-width:768px){
  .sidebar{position:fixed;left:0;top:0;height:100vh;z-index:200;transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .menu-btn{display:flex}
  .detail-panel{width:100vw}
  .names-grid{grid-template-columns:1fr 1fr}
  .cat-grid{grid-template-columns:repeat(3,1fr)}
  .notd-number{display:none}
}
@media(max-width:480px){
  .names-grid{grid-template-columns:1fr}
  .cat-grid{grid-template-columns:repeat(2,1fr)}
  .content{padding:16px}
  .topbar{padding:12px 16px}
}
</style>
</head>

<script>
// ------------------------------------------
// CATEGORIES
// ------------------------------------------
const CATEGORIES = {
  mercy:    { name:"Mercy & Compassion",    icon:"M", color:"#2d9c96", names:[] },
  majesty:  { name:"Majesty & Power",       icon:"M", color:"#8b5cf6", names:[] },
  wisdom:   { name:"Wisdom & Knowledge",    icon:"W", color:"#3b82f6", names:[] },
